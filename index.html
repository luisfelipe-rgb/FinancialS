function fmt(v) {

  return 'R$ ' + parseFloat(v).toLocaleString('pt-BR', {minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtData(d) {
  if (!d) return '—';
  const p = d.split('-');
  if (p.length !== 3) return d;
  return `${p[2]}/${p[1]}/${p[0]}`;
}

  if (p.length !== 3) return d;

// ===== GOOGLE DRIVE =====
const DEFAULT_CLIENT_ID = '685757864448-91bgfjui854sc0g3jj4tsnsh9qpg889c.apps.googleusercontent.com';
const DRIVE_SCOPES = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FOLDER_NAME = 'FinancialS';
let tokenClient = null;
let folderIdCache = null;

function getStoredToken() {
  try {
    const raw = sessionStorage.getItem('drive_token');
    if (!raw) return null;
    const t = JSON.parse(raw);
    if (t.expiresAt && Date.now() < t.expiresAt) return t;
  } catch(e) {}
  return null;
}

function setStoredToken(token, expiresInSec) {
  sessionStorage.setItem('drive_token', JSON.stringify({
    access_token: token,
    expiresAt: Date.now() + (expiresInSec * 1000) - 60_000
  }));
}

function clearStoredToken() {
  sessionStorage.removeItem('drive_token');
  folderIdCache = null;
}

function requestDriveToken(clientId, { prompt = '' } = {}) {
  return new Promise((resolve, reject) => {
    if (!window.google?.accounts?.oauth2) {
      reject(new Error('Google Identity Services não carregado'));
      return;
    }
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: DRIVE_SCOPES,
      callback: (resp) => {
        if (resp.error) { reject(new Error(resp.error)); return; }
        setStoredToken(resp.access_token, resp.expires_in || 3600);
        resolve(resp.access_token);
      },
      error_callback: (err) => reject(err)
    });
    tokenClient.requestAccessToken({ prompt });
  });
}

async function getDriveToken(clientId, { interactive = false } = {}) {
  const stored = getStoredToken();
  if (stored) return stored.access_token;
  return await requestDriveToken(clientId, { prompt: interactive ? 'consent' : '' });
}

async function ensureDriveFolder(token) {
  if (folderIdCache) return folderIdCache;
  const q = `name='${DRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
  const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)`, {
    headers: { Authorization: 'Bearer ' + token }
  });
  const searchData = await searchRes.json();
  if (searchData.files?.length) { folderIdCache = searchData.files[0].id; return folderIdCache; }
  const createRes = await fetch('https://www.googleapis.com/drive/v3/files?fields=id', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
  });
  const created = await createRes.json();
  folderIdCache = created.id;
  return folderIdCache;
}

function base64ToBlob(base64, mimeType) {
  const bytes = atob(base64);
  const arr = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
  return new Blob([arr], { type: mimeType || 'application/octet-stream' });
}

async function uploadFileToDrive(token, folderId, fileName, blob) {
  const metadata = { name: fileName, parents: [folderId] };
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
  form.append('file', blob);
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink,name', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + token },
    body: form
  });
  const data = await res.json();
  if (!data.id) throw new Error(data?.error?.message || 'Falha no upload');
  return data;
}

async function salvarFaturaNoDrive(clientId, fatura) {
  const token = await getDriveToken(clientId);
  const folderId = await ensureDriveFolder(token);
  const anexo = fatura.arquivo_anexado;
  if (!anexo?.base64) throw new Error('Arquivo não anexado');
  const ext = (anexo.name?.split('.').pop() || 'pdf').toLowerCase();
  const nomeArquivo = `${fatura.nome || 'fatura'}.${ext}`.replace(/[/\\:*?"<>|]/g, '_');
  const blob = base64ToBlob(anexo.base64, anexo.mimeType);
  const result = await uploadFileToDrive(token, folderId, nomeArquivo, blob);
  return result;
}

function exportarExcel(linhas, prefixo) {
  if (!linhas || linhas.length === 0) { showToast('⚠️ Nenhum dado para exportar', 'error'); return; }
  const dados = linhas.map(f => ({
    Fatura: f.nome || '',

}

// ===== PARSING DE FATURA =====
const FORNECEDOR_KEYWORDS = [
  { match: ['meta', 'facebook'], nome: 'Meta Ads (Facebook)' },
  { match: ['adplay'], nome: 'ADSPLAY Mídia' },
  { match: ['plugni'], nome: 'Plugni Tecnologia' },
  { match: ['telesign'], nome: 'Telesign do Brasil' },
  { match: ['slack'], nome: 'Slack' },
  { match: ['clickup'], nome: 'ClickUp' },
  { match: ['ifood'], nome: 'iFood Benefícios' },
  { match: ['lvt', 'best travel'], nome: 'Bruno Best Travel (LVT Viagens)' },
  { match: ['google ads', 'google llc'], nome: 'Google Ads' },
  { match: ['amazon web', 'aws'], nome: 'Amazon Web Services' },
  { match: ['tiktok'], nome: 'TikTok Ads' },
];

function sugerirFornecedorPorTexto(texto) {
  if (!texto) return '';
  const low = texto.toLowerCase();
  for (const k of FORNECEDOR_KEYWORDS) {
    if (k.match.some(m => low.includes(m))) return k.nome;
  }
  return '';
}

function parseBRL(s) {
  if (!s) return NaN;
  const clean = String(s).trim();
  if (clean.includes(',')) return parseFloat(clean.replace(/\./g, '').replace(',', '.'));
  return parseFloat(clean);
}

function dmyToIso(dmy) {
  const p = dmy.split('/');
  if (p.length !== 3) return '';
  return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
}

function parseInvoiceText(texto) {
  const out = { valor: '', data_pagamento: '', data_dre: '', fornecedor: '' };
  if (!texto) return out;

  // Valor: prioriza padrões "Total a pagar" / "Valor total"
  const padroesValor = [
    /total\s+a\s+pagar[^\d\n]{0,15}R?\$?\s*([\d.,]+)/i,
    /valor\s+total[^\d\n]{0,15}R?\$?\s*([\d.,]+)/i,
    /valor\s+do\s+documento[^\d\n]{0,15}R?\$?\s*([\d.,]+)/i,
    /total[^\d\n]{0,10}R?\$?\s*([\d.,]+\d{2})/i,
  ];
  for (const p of padroesValor) {
    const m = texto.match(p);
    if (m) {
      const v = parseBRL(m[1]);
      if (!isNaN(v) && v > 0) { out.valor = v.toFixed(2); break; }
    }
  }
  if (!out.valor) {
    const matches = [...texto.matchAll(/R\$\s*([\d.,]+)/g)]
      .map(m => parseBRL(m[1])).filter(v => !isNaN(v) && v > 0);
    if (matches.length) out.valor = Math.max(...matches).toFixed(2);
  }

  // Data de pagamento: rótulo "Vencimento"
  const vencMatch = texto.match(/venc(?:imento|e\s+em|er)[^\d]{0,20}(\d{2}\/\d{2}\/\d{4})/i)
    || texto.match(/(?:pagar\s+at[ée]|data\s+(?:de\s+)?pagamento)[^\d]{0,20}(\d{2}\/\d{2}\/\d{4})/i);
  if (vencMatch) out.data_pagamento = dmyToIso(vencMatch[1]);

  // Data de emissão / competência
  const emisMatch = texto.match(/(?:emiss[ãa]o|emit(?:ida|ido)|data\s+(?:da\s+)?(?:nota|fatura))[^\d]{0,20}(\d{2}\/\d{2}\/\d{4})/i);
  if (emisMatch) out.data_dre = dmyToIso(emisMatch[1]);

  // Fallback de datas
  if (!out.data_pagamento || !out.data_dre) {
    const todasDatas = [...texto.matchAll(/(\d{2}\/\d{2}\/\d{4})/g)]
      .map(m => dmyToIso(m[1])).filter(Boolean).sort();
    if (todasDatas.length) {
      if (!out.data_dre) out.data_dre = todasDatas[0];
      if (!out.data_pagamento) out.data_pagamento = todasDatas[todasDatas.length - 1];
    }
  }

  // Fornecedor: palavras-chave conhecidas (mais confiável que regex de razão social)
  out.fornecedor = sugerirFornecedorPorTexto(texto);

  return out;
}

async function extractPDFText(file) {
  if (!window.pdfjsLib) throw new Error('PDF.js não carregado');
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const partes = [];
  const maxPaginas = Math.min(pdf.numPages, 5);
  for (let i = 1; i <= maxPaginas; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    partes.push(content.items.map(it => it.str).join(' '));
  }
  return partes.join('\n');
}

async function extractTabularText(file, ext) {
  if (ext === 'csv') return await file.text();
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  return wb.SheetNames.map(n => XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n');
}

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => res(e.target.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function sugerirMesPorNome(nomeLimpo) {
  const mesMatch = nomeLimpo.match(/(\w{3,4})(?:\/|_|-|de\s)?(\d{4})/i);
  if (!mesMatch) return '';
  const meses = {jan:'01',fev:'02',mar:'03',abr:'04',mai:'05',jun:'06',jul:'07',ago:'08',set:'09',out:'10',nov:'11',dez:'12',
                 janeiro:'01',fevereiro:'02',março:'03',abril:'04',maio:'05',junho:'06',julho:'07',agosto:'08',setembro:'09',outubro:'10',novembro:'11',dezembro:'12',
                 january:'01',february:'02',march:'03',april:'04',may:'05',june:'06',july:'07',august:'08',september:'09',october:'10',november:'11',december:'12'};
  const mt = mesMatch[1].toLowerCase().substring(0,3);
  const ano = mesMatch[2];
  return meses[mt] ? `${ano}-${meses[mt]}-01` : '';
}

async function parseFile(file) {
  const nomeArquivo = file.name;
  const nomeLimpo = nomeArquivo.replace(/\.(pdf|xlsx|xls|csv|png|jpg|jpeg)$/i, '');
  const ext = (nomeArquivo.split('.').pop() || '').toLowerCase();
  const base64 = await fileToBase64(file);

  let fornecedor = sugerirFornecedorPorTexto(nomeLimpo);
  let valor = '';
  let data_pagamento = '';
  let data_dre = sugerirMesPorNome(nomeLimpo) || new Date().toISOString().split('T')[0];

  let texto = '';
  try {
    if (ext === 'pdf') texto = await extractPDFText(file);
    else if (ext === 'csv' || ext === 'xlsx' || ext === 'xls') texto = await extractTabularText(file, ext);
  } catch (e) {
    console.warn('Extração de texto falhou:', e);
  }

  if (texto) {
    const parsed = parseInvoiceText(texto);
    if (parsed.valor) valor = parsed.valor;
    if (parsed.data_pagamento) data_pagamento = parsed.data_pagamento;
    if (parsed.data_dre) data_dre = parsed.data_dre;
    if (parsed.fornecedor && !fornecedor) fornecedor = parsed.fornecedor;
  }

  return {
    arquivo_nome: nomeArquivo,
    arquivo_anexado: { name: nomeArquivo, base64, mimeType: file.type || 'application/octet-stream' },
    fornecedor,
    categoria: sugerirCategoria(nomeLimpo, fornecedor),
    valor,
    data_dre,
    data_pagamento,
    observacoes: `Anexado: ${nomeArquivo}`
  };
}

  const fileInputRef = useRef(null);

  useEffect(() => {
    if (clientId) localStorage.setItem('drive_client_id', clientId);
    else localStorage.removeItem('drive_client_id');
  }, [clientId]);

  const conectarDrive = async () => {
    if (!clientId) { showToast('⚠️ Configure o Client ID primeiro', 'error'); return; }
    try {
      await requestDriveToken(clientId, { prompt: 'consent' });
      setDriveConnected(true);
      showToast('✅ Google Drive conectado!');
    } catch (e) {
      setDriveConnected(false);
      showToast('Erro ao conectar: ' + (e.message || 'auth cancelada'), 'error');
    }
  };

  const desconectarDrive = () => {
    clearStoredToken();
    setDriveConnected(false);
    showToast('Drive desconectado');
  };

  const [form, setForm] = useState({
    fornecedor: '', valor: '', data_dre: '', data_pagamento: '',
    categoria: '', observacoes: '', arquivo_nome: '', arquivo_anexado: null
  });
  const [tick, setTick] = useState(0);
  const refresh = () => setTick(t => t + 1);

  const faturas = DB.faturas || [];

  // Persistir saldo
  useEffect(() => {
    const v = parseFloat(saldoInput);
    if (!isNaN(v) && v !== DB.saldoCaixa) {
      DB.saldoCaixa = v;
      saveData(DB);
    }
  }, [saldoInput]);

  const resetForm = () => setForm({
    fornecedor: '', valor: '', data_dre: '', data_pagamento: '',
    categoria: '', observacoes: '', arquivo_nome: '', arquivo_anexado: null
  });

  // ===== LEITURA DE FATURA (PDF.js + heurísticas) =====
  const processarArquivo = async (arquivo, abrirForm = true) => {
    setLendoIA(true);
    try {
      const sugerido = await parseFile(arquivo);
      setForm(f => ({ ...f, ...sugerido }));
      if (abrirForm) setShowForm(true);
      const partes = [];
      if (sugerido.valor) partes.push(fmt(parseFloat(sugerido.valor)));
      if (sugerido.fornecedor) partes.push(sugerido.fornecedor);
      if (sugerido.data_pagamento) partes.push('vence ' + fmtData(sugerido.data_pagamento));
      showToast(partes.length ? `📄 Extraído: ${partes.join(' • ')}` : '📄 Anexado — preencha os dados');
    } catch (e) {
      console.error(e);
      showToast('Erro ao ler arquivo', 'error');
    }
    setLendoIA(false);
  };

  // ===== HANDLE DROP =====
  const handleDrop = (files) => {
    setDragOver(false);
    if (!files || files.length === 0) return;
    const file = files[0];
    setAnexos(prev => [{ name: file.name, size: file.size, tipo: file.type }, ...prev].slice(0, 20));
    processarArquivo(file, true);
  };

  // ===== HANDLE UPLOAD DENTRO DO MODAL =====
  const modalFileInputRef = useRef(null);
  const handleModalUpload = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    processarArquivo(file, false);
    e.target.value = '';
  };

  // ===== SALVAR FATURA =====
  const salvarFatura = async () => {
    if (!form.fornecedor || !form.valor) {
      showToast('⚠️ Preencha fornecedor e valor', 'error');
      return;
    }

    const fatura = {
      id: editando ? editando.id : gerarId(),
      nome: gerarNomeFatura(form),
      fornecedor: form.fornecedor,
      valor: parseFloat(form.valor) || 0,
      data_dre: form.data_dre || new Date().toISOString().split('T')[0],
      data_pagamento: form.data_pagamento || '',
      categoria: form.categoria || 'Nao categorizado',
      observacoes: form.observacoes || '',
      arquivo_nome: form.arquivo_nome || '',
      arquivo_anexado: form.arquivo_anexado || null,
      drive_file_id: editando?.drive_file_id || null,
      drive_link: editando?.drive_link || null,
      criado_em: editando?.criado_em || new Date().toISOString()
    };

    const deveSalvarDrive = driveConnected && salvarNoDriveCheck && fatura.arquivo_anexado && !fatura.drive_file_id;
    if (deveSalvarDrive) {
      setSalvandoDrive(true);
      try {
        const result = await salvarFaturaNoDrive(clientId, fatura);
        fatura.drive_file_id = result.id;
        fatura.drive_link = result.webViewLink;
        showToast('☁️ Salvo no Drive: ' + result.name);
      } catch (e) {
        showToast('Erro Drive: ' + (e.message || 'falha no upload'), 'error');
        if (String(e.message || '').toLowerCase().includes('token')) setDriveConnected(false);
        setSalvandoDrive(false);
        return;
      }
      setSalvandoDrive(false);
    }

    if (editando) {
      const idx = DB.faturas.findIndex(f => f.id === editando.id);
      if (idx >= 0) DB.faturas[idx] = fatura;
      showToast('✅ Fatura atualizada!');
      setEditando(null);
    } else {
      DB.faturas.push(fatura);
      showToast(deveSalvarDrive ? '✅ Salvo localmente + Drive!' : '✅ Fatura cadastrada!');
    }
    saveData(DB);
    resetForm();
    setShowForm(false);
    refresh();
  };

  const editar = (item) => {
    setForm({
      arquivo_nome: item.arquivo_nome || '',
      arquivo_anexado: item.arquivo_anexado || null,
      fornecedor: item.fornecedor || '',
      valor: String(item.valor || ''),
      data_dre: item.data_dre || '',
      data_pagamento: item.data_pagamento || '',
      categoria: item.categoria || '',
      observacoes: item.observacoes || ''
    });
    setEditando(item);
    setShowForm(true);
  };

  const excluir = (item) => {
    if (!confirm(`Excluir "${item.nome}"?`)) return;
    DB.faturas = DB.faturas.filter(f => f.id !== item.id);
    saveData(DB);
    showToast('🗑️ Excluída');
    refresh();
  };

  // Filtrar
  const faturasFiltradas = faturas.filter(f => {
    if (filtroCat && f.categoria !== filtroCat) return false;
    if (busca) {
      const t = busca.toLowerCase();
      if (!(f.nome||'').toLowerCase().includes(t) && !(f.fornecedor||'').toLowerCase().includes(t)) return false;
    }
    return true;
  });

  // Meses disponiveis
  const mesesDRE = [...new Set(faturas.map(f => f.data_dre ? f.data_dre.substring(0,7) : '').filter(Boolean))].sort().reverse();
  const mesesCaixa = [...new Set(faturas.map(f => f.data_pagamento ? f.data_pagamento.substring(0,7) : '').filter(Boolean))].sort().reverse();

  // Filtro por mes
  const faturasDRE = mesDRE ? faturasFiltradas.filter(f => f.data_dre && f.data_dre.startsWith(mesDRE)) : faturasFiltradas;
  const faturasCaixa = mesCaixa ? faturasFiltradas.filter(f => f.data_pagamento && f.data_pagamento.startsWith(mesCaixa)) : faturasFiltradas;

  // Metricas
  const totalDRE = faturasDRE.reduce((s,f) => s + (parseFloat(f.valor)||0), 0);
  const totalCategorias = CATEGORIAS.length;
  const categoriasUsadas = new Set(faturasDRE.map(f => f.categoria).filter(Boolean)).size;

  const saldoAtual = parseFloat(saldoInput) || 0;
  const aPagarCaixa = faturasCaixa.reduce((s,f) => s + (parseFloat(f.valor)||0), 0);
  const saldoProjetado = saldoAtual - aPagarCaixa;

  // Proximos vencimentos (todas as faturas com data de pagamento futura)
  const hoje = (() => { const d = new Date(); d.setHours(12,0,0,0); return d; })();
  const aPagarOrdenado = faturas.filter(f => f.data_pagamento)
    .sort((a,b) => (a.data_pagamento||'').localeCompare(b.data_pagamento||''));

  const venc7d = aPagarOrdenado.filter(f => {
    const diff = (new Date(f.data_pagamento+'T12:00:00') - hoje) / (1000*60*60*24);
    return diff >= 0 && diff <= 7;
  });
  const total7d = venc7d.reduce((s,f) => s + (parseFloat(f.valor)||0), 0);

  // Render
  return (
    <div className="space-y-4 fade-in">
      {/* Header */}
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h1 className="text-xl md:text-2xl font-bold text-white">Financial<span className="bg-clip-text text-transparent bg-brand-gradient">S</span></h1>
          <p className="text-xs text-slate-400">Organizador Financeiro — DRE + Fluxo de Caixa</p>
        </div>
        <div className="flex gap-2 items-center">
          <button onClick={() => setShowConfig(true)} className="px-3 py-1.5 rounded-lg text-xs bg-slate-700 text-slate-300 hover:bg-slate-600 flex items-center gap-1.5">
            <span className={'w-1.5 h-1.5 rounded-full ' + (driveConnected ? 'bg-green-400' : 'bg-slate-500')}></span>
            ☁️ Drive
          </button>
          <button onClick={() => setShowForm(true)} className="px-4 py-2 rounded-lg text-sm font-medium text-white bg-brand-gradient btn-orange-glow">+ Nova Fatura</button>
        </div>
      </div>

      {/* Config Modal */}
      {showConfig && (
        <div className="fixed inset-0 bg-black/60 z-40 flex items-center justify-center p-4 overflow-auto" onClick={() => setShowConfig(false)}>
          <div className="bg-slate-800 rounded-xl p-5 max-w-lg w-full my-8" onClick={e => e.stopPropagation()}>
            <h2 className="text-lg font-bold mb-4">⚙️ Google Drive</h2>

            <div className="flex items-center gap-2 mb-4 px-3 py-2 rounded-lg bg-slate-900">
              <span className={'w-2 h-2 rounded-full ' + (driveConnected ? 'bg-green-400' : 'bg-slate-500')}></span>
              <span className="text-sm text-slate-300">{driveConnected ? 'Conectado' : 'Desconectado'}</span>
            </div>

            <details className="mb-4 bg-slate-900 rounded-lg p-3 text-xs text-slate-300">
              <summary className="cursor-pointer text-slate-200 font-medium">📋 Como obter o Client ID (1ª vez)</summary>
              <ol className="list-decimal pl-5 mt-2 space-y-1.5">
                <li>Abra <span className="text-brand-400">console.cloud.google.com</span> e crie um projeto.</li>
                <li>Em <b>APIs &amp; Services → Library</b>, ative <b>Google Drive API</b>.</li>
                <li>Em <b>APIs &amp; Services → OAuth consent screen</b>, escolha <b>External</b>, preencha nome do app + seu email, adicione seu email em <b>Test users</b>.</li>
                <li>Em <b>APIs &amp; Services → Credentials → Create credentials → OAuth client ID → Web application</b>:
                  <ul className="list-disc pl-5 mt-1">
                    <li><b>Authorized JavaScript origins:</b> <code className="bg-slate-800 px-1 rounded">http://localhost:3094</code> e a URL do GitHub Pages</li>
                  </ul>
                </li>
                <li>Copie o <b>Client ID</b> (termina em <code>.apps.googleusercontent.com</code>) e cole abaixo.</li>
              </ol>
            </details>

            <div className="space-y-3">
              <div>
                <label className="text-xs text-slate-400">Client ID</label>
                <input value={clientId} onChange={e => setClientId(e.target.value)} className="w-full px-3 py-2 rounded bg-slate-700 border border-slate-600 text-white text-sm mt-1 font-mono" placeholder="xxxxx.apps.googleusercontent.com" />
              </div>
              <div className="flex gap-2">
                {!driveConnected ? (
                  <button onClick={conectarDrive} disabled={!clientId} className="flex-1 px-4 py-2 rounded-lg text-sm bg-blue-600 hover:bg-blue-500 disabled:bg-slate-700 disabled:text-slate-500">🔗 Conectar Drive</button>
                ) : (
                  <button onClick={desconectarDrive} className="flex-1 px-4 py-2 rounded-lg text-sm bg-slate-700 hover:bg-slate-600">Desconectar</button>
                )}
              </div>
              {driveConnected && (
                <p className="text-xs text-slate-400">Arquivos são salvos na pasta <code className="bg-slate-900 px-1 rounded">FinancialS</code> do seu Drive. A app só vê arquivos que ela mesma criou (scope <code>drive.file</code>).</p>
              )}
            </div>

            <button onClick={() => setShowConfig(false)} className="w-full mt-4 px-4 py-2 rounded-lg text-sm bg-slate-700 hover:bg-slate-600">Fechar</button>
          </div>
        </div>
      )}

      {/* Abas */}
      <div className="flex gap-1 bg-slate-800 rounded-xl p-1">
        {['dre', 'caixa'].map(a => (
          <button key={a} onClick={() => { setAba(a); }}
            className={'flex-1 px-4 py-2.5 rounded-lg text-sm font-medium transition ' + (aba === a ? 'bg-brand-gradient text-white shadow' : 'text-slate-400 hover:text-white')}>
            {a === 'dre' ? '📋 DRE (Competência)' : '💰 Fluxo de Caixa'}
          </button>
        ))}
      </div>

      {/* Filtros */}
      <div className="flex flex-wrap gap-2">
        {aba === 'dre' && mesesDRE.length > 0 && (
          <select value={mesDRE} onChange={e => setMesDRE(e.target.value)} className="px-3 py-1.5 rounded-lg bg-slate-700 border border-slate-600 text-white text-xs">
            <option value="">Todos os meses</option>
            {mesesDRE.map(m => <option key={m} value={m}>{m}</option>)}
          </select>
        )}
        {aba === 'caixa' && mesesCaixa.length > 0 && (
          <select value={mesCaixa} onChange={e => setMesCaixa(e.target.value)} className="px-3 py-1.5 rounded-lg bg-slate-700 border border-slate-600 text-white text-xs">
            <option value="">Todos os meses</option>
            {mesesCaixa.map(m => <option key={m} value={m}>{m}</option>)}
          </select>
        )}
        <select value={filtroCat} onChange={e => setFiltroCat(e.target.value)} className="px-3 py-1.5 rounded-lg bg-slate-700 border border-slate-600 text-white text-xs">
          <option value="">Todas categorias</option>
          {CATEGORIAS.map(c => <option key={c.value} value={c.value}>{c.label}</option>)}
        </select>
        <input value={busca} onChange={e => setBusca(e.target.value)} className="flex-1 min-w-[120px] px-3 py-1.5 rounded-lg bg-slate-700 border border-slate-600 text-white text-xs" placeholder="🔍 Buscar..." />
      </div>

      {/* Drop zone */}
      <div 
        className={'border-2 border-dashed rounded-xl p-6 text-center transition ' + (dragOver ? 'drag-over border-brand-500' : 'border-slate-600')}
        onDragOver={e => { e.preventDefault(); setDragOver(true); }}
        onDragLeave={() => setDragOver(false)}
        onDrop={e => { e.preventDefault(); handleDrop(e.dataTransfer.files); }}
        onClick={() => fileInputRef.current?.click()}
      >
        <input ref={fileInputRef} type="file" accept=".pdf,.csv,.xlsx,.xls,.png,.jpg" className="hidden" onChange={e => handleDrop(e.target.files)} />
        <p className="text-slate-400 text-sm">📎 Arraste a fatura aqui ou clique para anexar</p>
        <p className="text-slate-600 text-xs mt-1">PDF, CSV, Excel, Imagem — IA extrai automaticamente</p>
      </div>

      {/* Form Modal */}
      {showForm && (
        <div className="fixed inset-0 bg-black/60 z-30 flex items-start justify-center p-4 pt-10 overflow-auto" onClick={() => !editando && resetForm()}>
          <div className="bg-slate-800 rounded-xl p-5 max-w-lg w-full" onClick={e => e.stopPropagation()}>
            <h2 className="text-lg font-bold mb-4">{editando ? '✏️ Editar Fatura' : '📄 Nova Fatura'}</h2>
            <div className="mb-4">
              <input ref={modalFileInputRef} type="file" accept=".pdf,.csv,.xlsx,.xls,.png,.jpg,.jpeg" className="hidden" onChange={handleModalUpload} />
              <button type="button" onClick={() => modalFileInputRef.current?.click()} className="w-full px-4 py-3 rounded-lg text-sm bg-slate-700 hover:bg-slate-600 border border-dashed border-slate-500 text-slate-200">
                📎 {form.arquivo_nome ? `Trocar arquivo: ${form.arquivo_nome}` : 'Anexar Fatura (PDF, Excel, CSV) — extrai dados automaticamente'}
              </button>
              {lendoIA && <p className="text-brand-400 text-xs mt-2 animate-pulse">🤖 Lendo documento...</p>}
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-xs text-slate-400">Fornecedor *</label>
                <input value={form.fornecedor} onChange={e => setForm({...form, fornecedor: e.target.value})} className="w-full px-3 py-2 rounded bg-slate-700 border border-slate-600 text-white text-sm mt-1" placeholder="Ex: Meta Ads" />
              </div>
              <div>
                <label className="text-xs text-slate-400">Valor (R$) *</label>
                <input type="number" step="0.01" value={form.valor} onChange={e => setForm({...form, valor: e.target.value})} className="w-full px-3 py-2 rounded bg-slate-700 border border-slate-600 text-white text-sm mt-1" placeholder="0,00" />
              </div>
              <div>
                <label className="text-xs text-slate-400">Data DRE (Competência)</label>
                <input type="date" value={form.data_dre} onChange={e => setForm({...form, data_dre: e.target.value})} className="w-full px-3 py-2 rounded bg-slate-700 border border-slate-600 text-white text-sm mt-1" />
              </div>
              <div>
                <label className="text-xs text-slate-400">Data Pagamento Prevista</label>
                <input type="date" value={form.data_pagamento} onChange={e => setForm({...form, data_pagamento: e.target.value})} className="w-full px-3 py-2 rounded bg-slate-700 border border-slate-600 text-white text-sm mt-1" />
              </div>
              <div className="col-span-2">
                <label className="text-xs text-slate-400">Categoria</label>
                <select value={form.categoria} onChange={e => setForm({...form, categoria: e.target.value})} className="w-full px-3 py-2 rounded bg-slate-700 border border-slate-600 text-white text-sm mt-1">
                  <option value="">Selecione...</option>
                  {CATEGORIAS.map(c => <option key={c.value} value={c.value}>{c.label}</option>)}
                </select>
              </div>
              <div className="col-span-2">
                <label className="text-xs text-slate-400">Nome da Fatura (gerado automaticamente)</label>
                <input value={gerarNomeFatura(form) || '—'} disabled className="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-slate-400 text-sm mt-1 font-mono" />
              </div>
              <div className="col-span-2">
                <label className="text-xs text-slate-400">Observações</label>
                <textarea value={form.observacoes} onChange={e => setForm({...form, observacoes: e.target.value})} className="w-full px-3 py-2 rounded bg-slate-700 border border-slate-600 text-white text-sm mt-1" rows="2" />
              </div>
            </div>
            {form.arquivo_anexado && (
              <div className="mt-3 flex items-center gap-2 px-3 py-2 rounded-lg bg-slate-900">
                <input id="drive-check" type="checkbox" checked={salvarNoDriveCheck && driveConnected} disabled={!driveConnected} onChange={e => setSalvarNoDriveCheck(e.target.checked)} className="accent-brand-600" />
                <label htmlFor="drive-check" className={'text-sm flex-1 ' + (driveConnected ? 'text-slate-200 cursor-pointer' : 'text-slate-500')}>
                  ☁️ Salvar arquivo no Google Drive
                </label>
                {!driveConnected && (
                  <button type="button" onClick={() => { setShowConfig(true); }} className="text-xs text-brand-400 hover:text-brand-300">Configurar</button>
                )}
              </div>
            )}
            <div className="flex gap-2 mt-4">
              <button onClick={salvarFatura} disabled={salvandoDrive} className="flex-1 px-4 py-2.5 rounded-lg text-sm font-medium text-white bg-brand-gradient btn-orange-glow disabled:opacity-60">
                {salvandoDrive ? '☁️ Enviando ao Drive...' : (editando ? 'Atualizar' : 'Salvar Fatura')}
              </button>
              <button onClick={() => { resetForm(); setShowForm(false); setEditando(null); }} disabled={salvandoDrive} className="px-4 py-2.5 rounded-lg text-sm bg-slate-700 hover:bg-slate-600 disabled:opacity-50">Cancelar</button>
            </div>
          </div>
        </div>
      )}

      {/* ABAS DE CONTEUDO */}
      {aba === 'dre' && (
        <div className="space-y-3">
          {/* KPI Cards DRE */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div className="bg-slate-800 rounded-xl p-4">
              <p className="text-xs text-slate-400">Total DRE ({mesDRE || 'geral'})</p>
              <p className="text-2xl font-bold text-white">{fmt(totalDRE)}</p>
            </div>
            <div className="bg-slate-800 rounded-xl p-4">
              <p className="text-xs text-slate-400">Faturas</p>
              <p className="text-2xl font-bold text-white">{faturasDRE.length}</p>
            </div>
            <div className="bg-slate-800 rounded-xl p-4">
              <p className="text-xs text-slate-400">Categorias usadas</p>
              <p className="text-2xl font-bold text-white">{categoriasUsadas}<span className="text-sm text-slate-500"> / {totalCategorias}</span></p>
            </div>
          </div>

          {/* Tabela DRE */}
          <div className="bg-slate-800 rounded-xl overflow-hidden">
            <div className="px-4 py-3 flex justify-between items-center border-b border-slate-700">
              <p className="text-sm font-medium">Faturas DRE ({faturasDRE.length})</p>
              <button onClick={() => exportarExcel(faturasDRE, 'dre')} className="px-3 py-1.5 rounded-lg text-xs bg-green-700 hover:bg-green-600">📥 Excel</button>
            </div>
            {faturasDRE.length === 0 ? (
              <div className="p-8 text-center text-slate-500 text-sm">Nenhuma fatura encontrada. Arraste um PDF acima!</div>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead>
                    <tr className="text-left text-slate-400 text-xs border-b border-slate-700">
                      <th className="p-3">Fornecedor</th>
                      <th className="p-3">Categoria</th>
                      <th className="p-3 text-right">Valor</th>
                      <th className="p-3">Data DRE</th>
                      <th className="p-3">Ações</th>
                    </tr>
                  </thead>
                  <tbody>
                    {faturasDRE.map(f => (
                      <tr key={f.id} className="border-b border-slate-700/50 hover:bg-slate-700/30">
                        <td className="p-3 text-white font-medium">{f.fornecedor}</td>
                        <td className="p-3 text-slate-300 text-xs">{(f.categoria || '').split('(')[0].trim()}</td>
                        <td className="p-3 text-right font-mono text-white">{fmt(f.valor)}</td>
                        <td className="p-3 text-slate-300">{fmtData(f.data_dre)}</td>
                        <td className="p-3">
                          <div className="flex gap-1">
                            {f.drive_link && (
                              <a href={f.drive_link} target="_blank" rel="noopener" title="Abrir no Drive" className="px-2 py-1 rounded text-xs bg-blue-900 hover:bg-blue-800">☁️</a>
                            )}
                            <button onClick={() => editar(f)} className="px-2 py-1 rounded text-xs bg-slate-700 hover:bg-slate-600">✏️</button>
                            <button onClick={() => excluir(f)} className="px-2 py-1 rounded text-xs bg-red-900 hover:bg-red-800">🗑️</button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      )}

      {aba === 'caixa' && (
        <div className="space-y-3">
          {/* KPI Cards Caixa */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div className="bg-slate-800 rounded-xl p-4">
              <p className="text-xs text-slate-400">Saldo Atual</p>
              <input type="number" value={saldoInput} onChange={e => setSaldoInput(e.target.value)} className="text-2xl font-bold text-white bg-transparent w-full outline-none" placeholder="0" />
            </div>
            <div className="bg-slate-800 rounded-xl p-4">
              <p className="text-xs text-slate-400">Total no período</p>
              <p className="text-2xl font-bold text-red-400">{fmt(aPagarCaixa)}</p>
            </div>
            <div className="bg-slate-800 rounded-xl p-4">
              <p className="text-xs text-slate-400">Saldo Projetado</p>
              <p className={'text-2xl font-bold ' + (saldoProjetado >= 0 ? 'text-green-400' : 'text-red-400')}>{fmt(saldoProjetado)}</p>
            </div>
          </div>

          {/* Alerta vencimentos */}
          {venc7d.length > 0 && (
            <div className="bg-yellow-900/40 border border-yellow-700 rounded-xl p-4">
              <p className="text-sm font-medium text-yellow-300">⚠️ {venc7d.length} fatura(s) vencem nos próximos 7 dias — total {fmt(total7d)}</p>
            </div>
          )}
          {saldoProjetado < 0 && (
            <div className="bg-red-900/40 border border-red-700 rounded-xl p-4">
              <p className="text-sm font-medium text-red-300">🔴 Saldo projetado negativo! Ajuste o saldo ou renegocie prazos.</p>
            </div>
          )}

          {/* Timeline vencimentos */}
          {aPagarOrdenado.length > 0 && (
            <div className="bg-slate-800 rounded-xl p-4">
              <div className="flex justify-between items-center mb-3">
                <p className="text-sm font-medium">📅 Linha do Tempo de Pagamentos</p>
                <button onClick={() => exportarExcel(aPagarOrdenado, 'fluxo_caixa')} className="px-3 py-1.5 rounded-lg text-xs bg-green-700 hover:bg-green-600">📥 Excel</button>
              </div>
              <div className="space-y-1 max-h-60 overflow-y-auto scrollbar-thin">
                {aPagarOrdenado.map(f => {
                  const diff = Math.ceil((new Date(f.data_pagamento+'T12:00:00') - hoje) / (1000*60*60*24));
                  const cor = diff <= 7 ? 'text-red-400' : diff <= 15 ? 'text-yellow-400' : 'text-slate-300';
                  return (
                    <div key={f.id} className="flex justify-between items-center px-3 py-2 bg-slate-700/50 rounded-lg text-sm">
                      <div className="flex-1">
                        <span className="text-white">{f.nome}</span>
                        <span className="text-slate-500 ml-2 text-xs">{f.fornecedor}</span>
                      </div>
                      <span className={'font-mono mx-3 ' + cor}>{fmt(f.valor)}</span>
                      <span className={'text-xs ' + cor}>{fmtData(f.data_pagamento)} {diff <= 0 ? '(vencida)' : `(em ${diff}d)`}</span>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* Tabela Caixa */}
          <div className="bg-slate-800 rounded-xl overflow-hidden">
            <div className="px-4 py-3 border-b border-slate-700">
              <p className="text-sm font-medium">Faturas ({faturasCaixa.length})</p>
            </div>
            {faturasCaixa.length === 0 ? (
              <div className="p-8 text-center text-slate-500 text-sm">Nenhuma fatura para o período selecionado</div>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead>
                    <tr className="text-left text-slate-400 text-xs border-b border-slate-700">
                      <th className="p-3">Fornecedor</th>
                      <th className="p-3">Categoria</th>
                      <th className="p-3 text-right">Valor</th>
                      <th className="p-3">Pagamento</th>
                      <th className="p-3">Ações</th>
                    </tr>
                  </thead>
                  <tbody>
                    {faturasCaixa.map(f => (
                      <tr key={f.id} className="border-b border-slate-700/50 hover:bg-slate-700/30">
                        <td className="p-3 text-white font-medium">{f.fornecedor}</td>
                        <td className="p-3 text-slate-300 text-xs">{(f.categoria || '').split('(')[0].trim()}</td>
                        <td className="p-3 text-right font-mono text-white">{fmt(f.valor)}</td>
                        <td className="p-3 text-slate-300">{fmtData(f.data_pagamento)}</td>
                        <td className="p-3">
                          <div className="flex gap-1">
                            {f.drive_link && (
                              <a href={f.drive_link} target="_blank" rel="noopener" title="Abrir no Drive" className="px-2 py-1 rounded text-xs bg-blue-900 hover:bg-blue-800">☁️</a>
                            )}
                            <button onClick={() => editar(f)} className="px-2 py-1 rounded text-xs bg-slate-700 hover:bg-slate-600">✏️</button>
                            <button onClick={() => excluir(f)} className="px-2 py-1 rounded text-xs bg-red-900 hover:bg-red-800">🗑️</button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      )}

      {/* Footer */}
      <div className="text-center text-xs text-slate-600 pt-4 pb-2">
        FinancialS v4 • {faturas.length} faturas cadastradas • Dados salvos no navegador
      </div>
    </div>
  );
}

// ===== RENDER =====
const root = ReactDOM.createRoot(document.getElementById('app'));
root.render(React.createElement(App));
</script>
</body>
</html>

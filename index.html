  if (/(consultor|advoc|advog|contábi|tributári|jurídic|assessor|bpo|gbarros)/.test(txt)) return 'Consultorias e Assessorias';
  if (/(telesign|claro|vivo| tim |internet|telefonia|sms|0800)/.test(txt)) return 'Telecomunicações';

function gerarNomeFatura(f) {

}

function fmt(v) {
  if (v === null || v === undefined || v === '') return 'R$ 0,00';
  return 'R$ ' + parseFloat(v).toLocaleString('pt-BR', {minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtData(d) {
  if (!d) return '—';
  const p = d.split('-');
  if (p.length !== 3) return d;
  return `${p[2]}/${p[1]}/${p[0]}`;
}
function mesAno(d) {
  if (!d) return '';
  const p = d.split('-');
  if (p.length !== 3) return d;
  const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

// ===== GOOGLE DRIVE =====
const DEFAULT_CLIENT_ID = '685757864448-91bgfjui854sc0g3jj4tsnsh9qpg889c.apps.googleusercontent.com';

const DEFAULT_SPREADSHEET_ID = '1jeIORzubQQcrziNBw3pwmg1m2qsFlV4SEWgUJHW7hl4';
const DRIVE_SCOPES = 'https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/spreadsheets';
const DRIVE_FOLDER_NAME = 'FinancialS';
const SCOPE_VERSION = 'v3-sheets'; // bump if scope changes, força re-auth
const SHEET_NAME = 'Faturas';
const SHEET_FILE_NAME = 'FinancialS - Faturas';
const SHEET_COLUMNS = ['id','nome','fornecedor','valor','data_dre','data_pagamento','categoria','moeda_original','valor_original','taxa_ptax','drive_file_id','drive_link','arquivo_nome','observacoes','criado_em','saldoCaixa','status'];
let tokenClient = null;
const folderIdCache = new Map();

function getStoredToken() {
  if (sessionStorage.getItem('drive_scope_version') !== SCOPE_VERSION) {
    sessionStorage.removeItem('drive_token');
    sessionStorage.setItem('drive_scope_version', SCOPE_VERSION);
    return null;
  }
  try {
    const raw = sessionStorage.getItem('drive_token');
    if (!raw) return null;
    const t = JSON.parse(raw);
    if (t.expiresAt && Date.now() < t.expiresAt) return t;
  } catch(e) {}
  return null;
}

function setStoredToken(token, expiresInSec) {
  sessionStorage.setItem('drive_token', JSON.stringify({
    access_token: token,
    expiresAt: Date.now() + (expiresInSec * 1000) - 60_000
  }));
}

function clearStoredToken() {
  sessionStorage.removeItem('drive_token');
  folderIdCache.clear();
}

function requestDriveToken(clientId, { prompt = '' } = {}) {
  return new Promise((resolve, reject) => {
    if (!window.google?.accounts?.oauth2) {
      reject(new Error('Google Identity Services não carregado'));
      return;
    }
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: DRIVE_SCOPES,
      callback: (resp) => {
        if (resp.error) { reject(new Error(resp.error)); return; }
        setStoredToken(resp.access_token, resp.expires_in || 3600);
        resolve(resp.access_token);
      },
      error_callback: (err) => reject(err)
    });
    tokenClient.requestAccessToken({ prompt });
  });
}

async function getDriveToken(clientId, { interactive = false } = {}) {
  const stored = getStoredToken();
  if (stored) return stored.access_token;
  return await requestDriveToken(clientId, { prompt: interactive ? 'consent' : '' });
}

async function findOrCreateFolder(token, name, parentId) {
  const key = `${parentId}/${name}`;
  if (folderIdCache.has(key)) return folderIdCache.get(key);
  const q = `name='${name.replace(/'/g, "\\'")}' and mimeType='application/vnd.google-apps.folder' and '${parentId}' in parents and trashed=false`;
  const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)`, {
    headers: { Authorization: 'Bearer ' + token }
  });
  const searchData = await searchRes.json();
  if (searchData.files?.length) { folderIdCache.set(key, searchData.files[0].id); return searchData.files[0].id; }
  const createRes = await fetch('https://www.googleapis.com/drive/v3/files?fields=id', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, mimeType: 'application/vnd.google-apps.folder', parents: [parentId] })
  });
  const created = await createRes.json();
  if (!created.id) throw new Error(created?.error?.message || 'Falha ao criar pasta');
  folderIdCache.set(key, created.id);
  return created.id;
}

async function ensureDriveFolder(token, subfolder, sharedFolderId) {
  const rootId = sharedFolderId || await findOrCreateFolder(token, DRIVE_FOLDER_NAME, 'root');
  if (!subfolder) return rootId;
  return await findOrCreateFolder(token, subfolder, rootId);
}

function parseFolderId(input) {
  if (!input) return '';
  const s = String(input).trim();
  const m = s.match(/\/folders\/([a-zA-Z0-9_-]+)/);
  if (m) return m[1];
  return s.split('?')[0].split('/')[0].split('#')[0].trim();
}

function base64ToBlob(base64, mimeType) {
  const bytes = atob(base64);
  const arr = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
  return new Blob([arr], { type: mimeType || 'application/octet-stream' });
}

const DATA_FILE_NAME = '_faturas.json';

async function findOrCreateDataFile(token, parentFolderId) {
  const q = `name='${DATA_FILE_NAME}' and '${parentFolderId}' in parents and trashed=false`;
  const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)`, {
    headers: { Authorization: 'Bearer ' + token }
  });
  const data = await searchRes.json();
  if (data.files?.length) return data.files[0].id;
  const metadata = { name: DATA_FILE_NAME, parents: [parentFolderId], mimeType: 'application/json' };
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
  form.append('file', new Blob([JSON.stringify({ faturas: [], saldoCaixa: 0 })], { type: 'application/json' }));
  const createRes = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + token },
    body: form
  });
  const created = await createRes.json();
  if (!created.id) throw new Error(created?.error?.message || 'Falha ao criar arquivo de dados');
  return created.id;
}

async function loadFaturasFromDrive(token, fileId) {
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
    headers: { Authorization: 'Bearer ' + token }
  });
  if (!res.ok) throw new Error('Falha ao baixar dados (HTTP ' + res.status + ')');
  const text = await res.text();
  if (!text.trim()) return { faturas: [], saldoCaixa: 0 };
  return JSON.parse(text);
}

function stripFaturasForSync(data) {
  return {
    ...data,
    faturas: (data.faturas || []).map(f => {
      const { arquivo_anexado, ...rest } = f;
      // mantém só nome/mime do anexo no JSON central, dropa base64
      return {
        ...rest,
        arquivo_anexado: arquivo_anexado
          ? { name: arquivo_anexado.name, mimeType: arquivo_anexado.mimeType }
          : null
      };
    })
  };
}

async function saveFaturasToDrive(token, fileId, data) {
  const payload = stripFaturasForSync(data);
  const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: 'PATCH',
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify(payload, null, 2)
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || 'Falha ao salvar dados (HTTP ' + res.status + ')');
  }
  return await res.json();
}

// ===== PLANILHA COMPARTILHADA (Google Sheets) =====
async function ensureSpreadsheetStructure(token, spreadsheetId) {
  // Garante que: (a) a primeira aba se chama "Faturas"; (b) a linha 1 tem o cabeçalho esperado.
  const metaRes = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}?fields=sheets.properties(sheetId,title,index)`, {
    headers: { Authorization: 'Bearer ' + token }
  });
  if (!metaRes.ok) {
    const err = await metaRes.json().catch(() => ({}));
    throw new Error(err?.error?.message || 'Sem acesso à planilha (HTTP ' + metaRes.status + ')');
  }
  const meta = await metaRes.json();
  const first = (meta.sheets || []).sort((a,b) => (a.properties.index||0) - (b.properties.index||0))[0]?.properties;
  if (!first) throw new Error('Planilha sem abas');

  if (first.title !== SHEET_NAME) {
    await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}:batchUpdate`, {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ requests: [{ updateSheetProperties: { properties: { sheetId: first.sheetId, title: SHEET_NAME }, fields: 'title' } }] })
    });
  }

  // Cabeçalho
  const lastCol = colLetter(SHEET_COLUMNS.length);
  const headerRes = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${SHEET_NAME}!A1:${lastCol}1`, {
    headers: { Authorization: 'Bearer ' + token }
  });
  const headerData = await headerRes.json();
  const existing = headerData.values?.[0] || [];
  const ok = SHEET_COLUMNS.every((c, i) => existing[i] === c);
  if (!ok) {
    await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${SHEET_NAME}!A1:${lastCol}1?valueInputOption=RAW`, {
      method: 'PUT',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ values: [SHEET_COLUMNS] })
    });
  }
}

async function findOrCreateSpreadsheet(token, parentFolderId) {
  const q = `name='${SHEET_FILE_NAME}' and mimeType='application/vnd.google-apps.spreadsheet' and '${parentFolderId}' in parents and trashed=false`;
  const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)`, {
    headers: { Authorization: 'Bearer ' + token }
  });
  const data = await searchRes.json();
  if (data.files?.length) return { id: data.files[0].id, created: false };

  // Cria via Drive API (já na pasta certa)
  const createRes = await fetch('https://www.googleapis.com/drive/v3/files?fields=id', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: SHEET_FILE_NAME, mimeType: 'application/vnd.google-apps.spreadsheet', parents: [parentFolderId] })
  });
  const created = await createRes.json();
  if (!created.id) throw new Error(created?.error?.message || 'Falha ao criar planilha');

  // Renomeia a primeira aba para "Faturas" e escreve o cabeçalho
  await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${created.id}:batchUpdate`, {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ requests: [{ updateSheetProperties: { properties: { sheetId: 0, title: SHEET_NAME }, fields: 'title' } }] })
  });
  await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${created.id}/values/${SHEET_NAME}!A1:${colLetter(SHEET_COLUMNS.length)}1?valueInputOption=RAW`, {
    method: 'PUT',
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ values: [SHEET_COLUMNS] })
  });
  return { id: created.id, created: true };
}

function colLetter(n) {
  let s = '';
  while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); }
  return s;
}

function rowToFatura(row) {
  const f = {};
  SHEET_COLUMNS.forEach((c, i) => { f[c] = row[i] ?? ''; });
  // tipos numéricos
  ['valor','valor_original','taxa_ptax','saldoCaixa'].forEach(k => {
    if (f[k] !== '' && f[k] != null) f[k] = parseFloat(f[k]) || 0;
  });
  // arquivo_anexado vira metadata mínima a partir de arquivo_nome (sem base64)
  if (f.arquivo_nome) f.arquivo_anexado = { name: f.arquivo_nome, mimeType: '' };
  return f;
}

function faturaToRow(f) {
  return SHEET_COLUMNS.map(c => {
    const v = f[c];
    if (v === null || v === undefined) return '';
    return v;
  });
}

async function loadFaturasFromSheet(token, spreadsheetId) {
  const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${SHEET_NAME}!A2:${colLetter(SHEET_COLUMNS.length)}?majorDimension=ROWS`, {
    headers: { Authorization: 'Bearer ' + token }
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || 'HTTP ' + res.status);
  }
  const data = await res.json();
  const rows = data.values || [];
  const faturas = rows.map(rowToFatura).filter(f => f.id);
  // saldoCaixa fica na primeira linha (qualquer linha, pegamos da primeira não vazia)
  const saldoCaixa = faturas.find(f => f.saldoCaixa)?.saldoCaixa ?? 0;
  // remove o campo saldoCaixa dos records (ele é "global")
  faturas.forEach(f => delete f.saldoCaixa);
  return { faturas, saldoCaixa };
}

async function saveFaturasToSheet(token, spreadsheetId, db) {
  const faturas = db.faturas || [];
  // injeta saldoCaixa só na primeira linha
  const rows = faturas.map((f, i) => faturaToRow({ ...f, saldoCaixa: i === 0 ? (db.saldoCaixa || 0) : '' }));
  // limpa o range de dados (linha 2 em diante) e escreve tudo
  const lastCol = colLetter(SHEET_COLUMNS.length);
  await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${SHEET_NAME}!A2:${lastCol}:clear`, {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: '{}'
  });
  if (rows.length === 0) return;
  const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${SHEET_NAME}!A2?valueInputOption=RAW`, {
    method: 'PUT',
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ values: rows })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || 'HTTP ' + res.status);
  }
}

async function deleteDriveFile(token, fileId) {
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}`, {
    method: 'DELETE',
    headers: { Authorization: 'Bearer ' + token }
  });
  if (!res.ok && res.status !== 404) {
    const data = await res.json().catch(() => ({}));
    throw new Error(data?.error?.message || `HTTP ${res.status}`);
  }
}

async function updateDriveFile(token, fileId, { newName, addParent, removeParent } = {}) {
  const params = new URLSearchParams();
  params.set('fields', 'id,webViewLink,name,parents');
  if (addParent) params.set('addParents', addParent);
  if (removeParent) params.set('removeParents', removeParent);
  const body = {};
  if (newName) body.name = newName;
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?${params}`, {
    method: 'PATCH',
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if (!data.id) throw new Error(data?.error?.message || 'Falha ao atualizar arquivo');
  return data;
}

function monthSubfolderName(dataIso) {
  const [year, month] = (dataIso || '').split('-');
  if (!year || !month) return '';
  return `${month}_${year}`;
}

function driveFileNameFor(fatura) {
  const ext = (fatura.arquivo_anexado?.name?.split('.').pop() || fatura.arquivo_nome?.split('.').pop() || 'pdf').toLowerCase();
  return `${fatura.nome || 'fatura'}.${ext}`.replace(/[/\\:*?"<>|]/g, '_');
}

async function uploadFileToDrive(token, folderId, fileName, blob) {
  const metadata = { name: fileName, parents: [folderId] };
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
  form.append('file', blob);
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink,name', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + token },
    body: form
  });
  const data = await res.json();
  if (!data.id) throw new Error(data?.error?.message || 'Falha no upload');
  return data;
}

async function salvarFaturaNoDrive(clientId, fatura, sharedFolderId) {
  const token = await getDriveToken(clientId);
  const dataDre = fatura.data_dre || new Date().toISOString().split('T')[0];
  const mesSub = monthSubfolderName(dataDre);
  const folderId = await ensureDriveFolder(token, mesSub, sharedFolderId);
  const anexo = fatura.arquivo_anexado;
  if (!anexo?.base64) throw new Error('Arquivo não anexado');
  const nomeArquivo = driveFileNameFor(fatura);
  const blob = base64ToBlob(anexo.base64, anexo.mimeType);
  const result = await uploadFileToDrive(token, folderId, nomeArquivo, blob);
  return { ...result, folder: mesSub };
}

async function sincronizarFaturaNoDrive(clientId, novaFatura, faturaAntiga, sharedFolderId) {
  const novoNome = driveFileNameFor(novaFatura);
  const antigoNome = driveFileNameFor(faturaAntiga);
  const novoMes = monthSubfolderName(novaFatura.data_dre);
  const antigoMes = monthSubfolderName(faturaAntiga.data_dre);
  const precisaRenomear = novoNome !== antigoNome;
  const precisaMover = novoMes !== antigoMes;
  if (!precisaRenomear && !precisaMover) return null;
  const token = await getDriveToken(clientId);
  const opts = {};
  if (precisaRenomear) opts.newName = novoNome;
  if (precisaMover) {
    opts.addParent = await ensureDriveFolder(token, novoMes, sharedFolderId);
    opts.removeParent = await ensureDriveFolder(token, antigoMes, sharedFolderId);
  }
  return await updateDriveFile(token, novaFatura.drive_file_id, opts);
}

// ===== PARSING DE FATURA =====
const FORNECEDOR_KEYWORDS = [
  { match: ['meta', 'facebook'], nome: 'Meta Ads (Facebook)' },
  { match: ['adplay'], nome: 'ADSPLAY Mídia' },
  { match: ['plugni'], nome: 'Plugni Tecnologia' },
  { match: ['telesign'], nome: 'Telesign do Brasil' },
  { match: ['slack'], nome: 'Slack' },
  { match: ['clickup'], nome: 'ClickUp' },
  { match: ['ifood'], nome: 'iFood Benefícios' },
  { match: ['lvt', 'best travel'], nome: 'Bruno Best Travel (LVT Viagens)' },
  { match: ['google ads', 'google llc'], nome: 'Google Ads' },
  { match: ['amazon web', 'aws'], nome: 'Amazon Web Services' },
  { match: ['tiktok'], nome: 'TikTok Ads' },
];

function sugerirFornecedorPorTexto(texto) {
  if (!texto) return '';
  const low = texto.toLowerCase();
  for (const k of FORNECEDOR_KEYWORDS) {
    if (k.match.some(m => low.includes(m))) return k.nome;
  }
  return '';
}

function parseNumber(s) {
  if (!s) return NaN;
  const clean = String(s).trim().replace(/[^\d.,-]/g, '');
  if (!clean) return NaN;
  const lastDot = clean.lastIndexOf('.');
  const lastComma = clean.lastIndexOf(',');
  if (lastDot === -1 && lastComma === -1) return parseFloat(clean);
  const decimal = lastDot > lastComma ? '.' : ',';
  const thousands = decimal === '.' ? ',' : '.';
  return parseFloat(clean.split(thousands).join('').replace(decimal, '.'));
}

function detectCurrency(texto) {
  if (!texto) return '';
  const t = texto.toLowerCase();
  if (/us\$|\busd\b|d[óo]lar|dollars?/i.test(t)) return 'USD';
  if (/r\$|\bbrl\b|reais|\breal\b/i.test(t)) return 'BRL';
  return '';
}

function dmyToIso(dmy) {
  const p = dmy.split('/');
  if (p.length !== 3) return '';
  return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
}

function mdyToIso(mdy) {
  const p = mdy.split('/');
  if (p.length !== 3) return '';
  return `${p[2]}-${p[0].padStart(2,'0')}-${p[1].padStart(2,'0')}`;
}

function parseInvoiceText(texto) {
  const out = { valor: '', moeda: '', data_pagamento: '', data_dre: '', fornecedor: '' };
  if (!texto) return out;

  out.moeda = detectCurrency(texto);

  // Valor: prioriza padrões "Total a pagar" / "Valor total" (aceita R$, US$, $)
  const symGroup = '(?:US\\$|R\\$|USD|BRL|\\$)?';
  const padroesValor = [
    new RegExp(`total\\s+a\\s+pagar[^\\d\\n]{0,15}${symGroup}\\s*([\\d.,]+)`, 'i'),
    new RegExp(`valor\\s+total[^\\d\\n]{0,15}${symGroup}\\s*([\\d.,]+)`, 'i'),
    new RegExp(`amount\\s+due[^\\d\\n]{0,15}${symGroup}\\s*([\\d.,]+)`, 'i'),
    new RegExp(`valor\\s+do\\s+documento[^\\d\\n]{0,15}${symGroup}\\s*([\\d.,]+)`, 'i'),
    new RegExp(`total[^\\d\\n]{0,10}${symGroup}\\s*([\\d.,]+\\d{2})`, 'i'),
  ];
  for (const p of padroesValor) {
    const m = texto.match(p);
    if (m) {
      const v = parseNumber(m[1]);
      if (!isNaN(v) && v > 0) { out.valor = v.toFixed(2); break; }
    }
  }
  if (!out.valor) {
    const symRegex = out.moeda === 'USD' ? /(?:US\$|USD|\$)\s*([\d.,]+)/g : /R\$\s*([\d.,]+)/g;
    const matches = [...texto.matchAll(symRegex)]
      .map(m => parseNumber(m[1])).filter(v => !isNaN(v) && v > 0);
    if (matches.length) out.valor = Math.max(...matches).toFixed(2);
  }
  if (!out.moeda && out.valor) out.moeda = 'BRL';

  // Data: USD usa MM/DD/YYYY; BRL usa DD/MM/YYYY
  const dateToIso = out.moeda === 'USD' ? mdyToIso : dmyToIso;

  const vencMatch = texto.match(/venc(?:imento|e\s+em|er)[^\d]{0,20}(\d{2}\/\d{2}\/\d{4})/i)
    || texto.match(/(?:pagar\s+at[ée]|data\s+(?:de\s+)?pagamento|due\s+(?:date|by))[^\d]{0,20}(\d{2}\/\d{2}\/\d{4})/i);
  if (vencMatch) out.data_pagamento = dateToIso(vencMatch[1]);

  const emisMatch = texto.match(/(?:emiss[ãa]o|emit(?:ida|ido)|data\s+(?:da\s+)?(?:nota|fatura)|invoice\s+date|issued)[^\d]{0,20}(\d{2}\/\d{2}\/\d{4})/i);
  if (emisMatch) out.data_dre = dateToIso(emisMatch[1]);

  if (!out.data_pagamento || !out.data_dre) {
    const todasDatas = [...texto.matchAll(/(\d{2}\/\d{2}\/\d{4})/g)]
      .map(m => dateToIso(m[1])).filter(Boolean).sort();
    if (todasDatas.length) {
      if (!out.data_dre) out.data_dre = todasDatas[0];
      if (!out.data_pagamento) out.data_pagamento = todasDatas[todasDatas.length - 1];
    }
  }

  // Fornecedor: palavras-chave conhecidas (mais confiável que regex de razão social)
  out.fornecedor = sugerirFornecedorPorTexto(texto);

  return out;
}

async function extractPDFText(file) {
  if (!window.pdfjsLib) throw new Error('PDF.js não carregado');
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const partes = [];
  const maxPaginas = Math.min(pdf.numPages, 5);
  for (let i = 1; i <= maxPaginas; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    partes.push(content.items.map(it => it.str).join(' '));
  }
  return partes.join('\n');
}

async function extractTabularText(file, ext) {
  if (ext === 'csv') return await file.text();
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  return wb.SheetNames.map(n => XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n');
}

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => res(e.target.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function sugerirMesPorNome(nomeLimpo) {
  const mesMatch = nomeLimpo.match(/(\w{3,4})(?:\/|_|-|de\s)?(\d{4})/i);
  if (!mesMatch) return '';
  const meses = {jan:'01',fev:'02',mar:'03',abr:'04',mai:'05',jun:'06',jul:'07',ago:'08',set:'09',out:'10',nov:'11',dez:'12',
                 janeiro:'01',fevereiro:'02',março:'03',abril:'04',maio:'05',junho:'06',julho:'07',agosto:'08',setembro:'09',outubro:'10',novembro:'11',dezembro:'12',
                 january:'01',february:'02',march:'03',april:'04',may:'05',june:'06',july:'07',august:'08',september:'09',october:'10',november:'11',december:'12'};
  const mt = mesMatch[1].toLowerCase().substring(0,3);
  const ano = mesMatch[2];
  return meses[mt] ? `${ano}-${meses[mt]}-01` : '';
}

// ===== COTAÇÃO USD/BRL (PTAX - Banco Central) =====
const RATE_CACHE_KEY = 'fx_usd_brl_monthly_v1';
const RATE_TTL_MS = 24 * 60 * 60 * 1000;

function getRateCache() {
  try { return JSON.parse(localStorage.getItem(RATE_CACHE_KEY) || '{}'); } catch { return {}; }
}

async function fetchMonthlyUSDRate(yyyyMm) {
  const cache = getRateCache();
  const cached = cache[yyyyMm];
  const isCurrent = yyyyMm === new Date().toISOString().substring(0, 7);
  if (cached && (!isCurrent || (Date.now() - cached.ts) < RATE_TTL_MS)) return cached;

  const [year, month] = yyyyMm.split('-').map(Number);
  const firstDay = `${String(month).padStart(2,'0')}-01-${year}`;
  const lastDayOfMonth = new Date(year, month, 0).getDate();
  const today = new Date();
  const endDay = (today.getFullYear() === year && today.getMonth() + 1 === month) ? today.getDate() : lastDayOfMonth;
  const lastDay = `${String(month).padStart(2,'0')}-${String(endDay).padStart(2,'0')}-${year}`;

  const url = `https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata/CotacaoDolarPeriodo(dataInicial=@dataInicial,dataFinalCotacao=@dataFinalCotacao)?@dataInicial='${firstDay}'&@dataFinalCotacao='${lastDay}'&$format=json&$select=cotacaoVenda`;
  const res = await fetch(url);
  const data = await res.json();
  const rates = (data.value || []).map(r => r.cotacaoVenda).filter(r => typeof r === 'number' && r > 0);
  if (!rates.length) throw new Error('PTAX indisponível para ' + yyyyMm);
  const media = rates.reduce((s, r) => s + r, 0) / rates.length;
  const entry = { rate: media, samples: rates.length, ts: Date.now() };
  cache[yyyyMm] = entry;
  localStorage.setItem(RATE_CACHE_KEY, JSON.stringify(cache));
  return entry;
}

async function parseFile(file) {
  const nomeArquivo = file.name;
  const nomeLimpo = nomeArquivo.replace(/\.(pdf|xlsx|xls|csv|png|jpg|jpeg)$/i, '');
  const ext = (nomeArquivo.split('.').pop() || '').toLowerCase();
  const base64 = await fileToBase64(file);

  let fornecedor = sugerirFornecedorPorTexto(nomeLimpo);
  let valor = '';
  let moeda = '';
  let data_pagamento = '';
  let data_dre = sugerirMesPorNome(nomeLimpo) || new Date().toISOString().split('T')[0];

  let texto = '';
  try {
    if (ext === 'pdf') texto = await extractPDFText(file);
    else if (ext === 'csv' || ext === 'xlsx' || ext === 'xls') texto = await extractTabularText(file, ext);
  } catch (e) {
    console.warn('Extração de texto falhou:', e);
  }

  if (texto) {
    const parsed = parseInvoiceText(texto);
    if (parsed.valor) valor = parsed.valor;
    if (parsed.moeda) moeda = parsed.moeda;
    if (parsed.data_pagamento) data_pagamento = parsed.data_pagamento;
    if (parsed.data_dre) data_dre = parsed.data_dre;
    if (parsed.fornecedor && !fornecedor) fornecedor = parsed.fornecedor;
  }

  const out = {
    arquivo_nome: nomeArquivo,
    arquivo_anexado: { name: nomeArquivo, base64, mimeType: file.type || 'application/octet-stream' },
    fornecedor,
    categoria: sugerirCategoria(nomeLimpo, fornecedor),
    valor,
    data_dre,
    data_pagamento,
    moeda_original: '',
    valor_original: '',
    taxa_ptax: '',
    observacoes: `Anexado: ${nomeArquivo}`
  };

  if (moeda === 'USD' && valor) {
    try {
      const yyyyMm = data_dre.substring(0, 7);
      const rate = await fetchMonthlyUSDRate(yyyyMm);
      const valorBrl = parseFloat(valor) * rate.rate;
      out.valor_original = valor;
      out.moeda_original = 'USD';
      out.taxa_ptax = rate.rate.toFixed(4);
      out.valor = valorBrl.toFixed(2);
    } catch (e) {
      console.warn('Conversão USD→BRL falhou:', e);
    }
  }

  return out;
}

      if (abrirForm) setShowForm(true);
      const partes = [];
      if (sugerido.moeda_original === 'USD') partes.push(`USD ${parseFloat(sugerido.valor_original).toFixed(2)} → ${fmt(parseFloat(sugerido.valor))} @ PTAX ${parseFloat(sugerido.taxa_ptax).toFixed(4)}`);
      else if (sugerido.valor) partes.push(fmt(parseFloat(sugerido.valor)));
      if (sugerido.fornecedor) partes.push(sugerido.fornecedor);
      if (sugerido.data_pagamento) partes.push('vence ' + fmtData(sugerido.data_pagamento));
      showToast(partes.length ? `📄 Extraído: ${partes.join(' • ')}` : '📄 Anexado — preencha os dados');
    } catch (e) {
      console.error(e);
      showToast('Erro ao ler arquivo', 'error');
    }
    setLendoIA(false);
  };

  // ===== HANDLE DROP =====
  const handleDrop = (files) => {
    setDragOver(false);
    if (!files || files.length === 0) return;
    const file = files[0];
    setAnexos(prev => [{ name: file.name, size: file.size, tipo: file.type }, ...prev].slice(0, 20));
    processarArquivo(file, true);
  };

  // ===== HANDLE UPLOAD DENTRO DO MODAL =====
  const modalFileInputRef = useRef(null);
  const handleModalUpload = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    processarArquivo(file, false);
    e.target.value = '';
  };

  // ===== SALVAR FATURA =====
  const salvarFatura = async () => {
    if (!form.fornecedor || !form.valor) {
      showToast('⚠️ Preencha fornecedor e valor', 'error');
      return;
    }

    const fatura = {
      id: editando ? editando.id : gerarId(),
      nome: gerarNomeFatura(form),
      fornecedor: form.fornecedor,
      valor: parseFloat(form.valor) || 0,
      data_dre: form.data_dre || new Date().toISOString().split('T')[0],
      data_pagamento: form.data_pagamento || '',
      categoria: form.categoria || 'Nao categorizado',
      status: form.status || 'Pendente',
      observacoes: form.observacoes || '',
      arquivo_nome: form.arquivo_nome || '',
      arquivo_anexado: form.arquivo_anexado || null,
      drive_file_id: editando?.drive_file_id || null,
      drive_link: editando?.drive_link || null,
      moeda_original: form.moeda_original || '',
      valor_original: form.valor_original ? parseFloat(form.valor_original) : '',
      taxa_ptax: form.taxa_ptax ? parseFloat(form.taxa_ptax) : '',
      criado_em: editando?.criado_em || new Date().toISOString()
    };

    const deveSalvarDrive = driveConnected && salvarNoDriveCheck && fatura.arquivo_anexado?.base64 && !fatura.drive_file_id;
    if (deveSalvarDrive) {
      setSalvandoDrive(true);
      try {
        const result = await salvarFaturaNoDrive(clientId, fatura, sharedFolderId);
        fatura.drive_file_id = result.id;
        fatura.drive_link = result.webViewLink;
        // Drop base64 — o arquivo já está no Drive, não precisa duplicar no localStorage
        fatura.arquivo_anexado = { name: fatura.arquivo_anexado.name, mimeType: fatura.arquivo_anexado.mimeType };
        showToast('☁️ Salvo no Drive: FinancialS/' + result.folder + '/' + result.name);
      } catch (e) {
        showToast('Erro Drive: ' + (e.message || 'falha no upload'), 'error');
        if (String(e.message || '').toLowerCase().includes('token')) setDriveConnected(false);
        setSalvandoDrive(false);
        return;
      }
      setSalvandoDrive(false);
    }

    if (editando) {
      if (fatura.drive_file_id && driveConnected) {
        setSalvandoDrive(true);
        try {
          const sync = await sincronizarFaturaNoDrive(clientId, fatura, editando, sharedFolderId);
          if (sync) {
            fatura.drive_link = sync.webViewLink || fatura.drive_link;
            showToast('☁️ Drive atualizado: ' + sync.name);
          }
        } catch (e) {
          showToast('⚠️ Sync Drive falhou: ' + (e.message || ''), 'error');
        }
        setSalvandoDrive(false);
      }
      const idx = DB.faturas.findIndex(f => f.id === editando.id);
      if (idx >= 0) DB.faturas[idx] = fatura;
      showToast('✅ Fatura atualizada!');
      setEditando(null);
    } else {
      DB.faturas.push(fatura);
      showToast(deveSalvarDrive ? '✅ Salvo localmente + Drive!' : '✅ Fatura cadastrada!');
    }
    saveData(DB);
    await salvarNoCompartilhado();
    resetForm();
    setShowForm(false);
    refresh();
  };

  const editar = (item) => {
    setForm({
      arquivo_nome: item.arquivo_nome || '',
      arquivo_anexado: item.arquivo_anexado || null,
      fornecedor: item.fornecedor || '',
      valor: String(item.valor || ''),
      data_dre: item.data_dre || '',
      data_pagamento: item.data_pagamento || '',
      categoria: item.categoria || '',
      status: item.status || 'Pendente',
      observacoes: item.observacoes || '',
      moeda_original: item.moeda_original || '',
      valor_original: item.valor_original ? String(item.valor_original) : '',
      taxa_ptax: item.taxa_ptax ? String(item.taxa_ptax) : ''
    });
    setEditando(item);
    setShowForm(true);
  };

  const toggleStatus = async (item) => {
    const statusList = ['Pendente', 'Pago', 'Agendado', 'Vencido'];
    const idx = statusList.indexOf(item.status || 'Pendente');
    const prox = statusList[(idx + 1) % statusList.length];
    const f = DB.faturas.find(x => x.id === item.id);
    if (!f) return;
    f.status = prox;
    saveData(DB);
    showToast(`Status: ${prox}`);
    refresh();
    await salvarNoCompartilhado();
  };

  const excluir = async (item) => {
    const temDrive = item.drive_file_id && driveConnected;
    const msg = temDrive
      ? `Excluir "${item.nome}"?\n\n⚠️ O arquivo também será apagado do Google Drive.`
      : `Excluir "${item.nome}"?`;
    if (!confirm(msg)) return;
    if (temDrive) {
      try {
        const token = await getDriveToken(clientId);
        await deleteDriveFile(token, item.drive_file_id);
        showToast('🗑️ Excluída (local + Drive)');
      } catch (e) {
        showToast('⚠️ Apagada local — Drive falhou: ' + (e.message || ''), 'error');
      }
    } else {
      showToast('🗑️ Excluída');
    }
    DB.faturas = DB.faturas.filter(f => f.id !== item.id);
    saveData(DB);
    await salvarNoCompartilhado();
    refresh();
  };

  // Filtrar
  const faturasFiltradas = faturas.filter(f => {
    if (filtroCat && f.categoria !== filtroCat) return false;
    if (filtroStatus && (f.status || 'Pendente') !== filtroStatus) return false;
    if (busca) {
      const t = busca.toLowerCase();
      if (!(f.nome||'').toLowerCase().includes(t) && !(f.fornecedor||'').toLowerCase().includes(t)) return false;
    }
    return true;
  });

  // Meses disponiveis
  const mesesDRE = [...new Set(faturas.map(f => f.data_dre ? f.data_dre.substring(0,7) : '').filter(Boolean))].sort().reverse();

  // Filtro por mes
  const faturasDRE = mesDRE ? faturasFiltradas.filter(f => f.data_dre && f.data_dre.startsWith(mesDRE)) : faturasFiltradas;

  // Metricas
  const totalDRE = faturasDRE.reduce((s,f) => s + (parseFloat(f.valor)||0), 0);
  const totalCategorias = CATEGORIAS.length;
  const categoriasUsadas = new Set(faturasDRE.map(f => f.categoria).filter(Boolean)).size;

  // Contas a Pagar: exclui Pago, agrupa por bucket de vencimento
  const hoje = (() => { const d = new Date(); d.setHours(12,0,0,0); return d; })();
  const diasAte = (iso) => Math.floor((new Date(iso + 'T12:00:00') - hoje) / (1000*60*60*24));

  const aPagar = faturasFiltradas
    .filter(f => (f.status || 'Pendente') !== 'Pago' && f.data_pagamento)
    .map(f => ({ ...f, _dias: diasAte(f.data_pagamento) }))
    .sort((a,b) => a._dias - b._dias);

  const buckets = {
    vencidas: aPagar.filter(f => f._dias < 0),
    semana:   aPagar.filter(f => f._dias >= 0 && f._dias <= 7),
    mes:      aPagar.filter(f => f._dias > 7 && f._dias <= 30),
    futuro:   aPagar.filter(f => f._dias > 30),
  };
  const totalBucket = (arr) => arr.reduce((s,f) => s + (parseFloat(f.valor)||0), 0);
  const totalAPagar = totalBucket(aPagar);

  // Render
  return (
    <div className="space-y-4 fade-in">
      {/* Header */}
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h1 className="text-xl md:text-2xl font-bold text-white">Financial<span className="bg-clip-text text-transparent bg-brand-gradient">S</span></h1>
          <p className="text-xs text-slate-400">Organizador Financeiro — DRE + Fluxo de Caixa</p>
        </div>
        <div className="flex gap-2 items-center">
          {driveConnected && (
            <button onClick={() => sincronizarDoDrive({toast: true})} disabled={sincronizando} title={ultimaSincr ? 'Última sync: ' + ultimaSincr.toLocaleTimeString('pt-BR') : 'Sincronizar com a equipe'} className="px-2.5 py-1.5 rounded-lg text-xs bg-slate-700 text-slate-300 hover:bg-slate-600 disabled:opacity-60">
              {sincronizando ? '⟳ Sincronizando...' : '⟳ Sync'}
            </button>
          )}
          <button onClick={() => setShowConfig(true)} className="px-3 py-1.5 rounded-lg text-xs bg-slate-700 text-slate-300 hover:bg-slate-600 flex items-center gap-1.5">
            <span className={'w-1.5 h-1.5 rounded-full ' + (driveConnected ? 'bg-green-400' : 'bg-slate-500')}></span>
            ☁️ Drive
          </button>
          <button onClick={() => setShowForm(true)} className="px-4 py-2 rounded-lg text-sm font-medium text-white bg-brand-gradient btn-orange-glow">+ Nova Fatura</button>
        </div>
      </div>

      {/* Config Modal */}
      {showConfig && (
        <div className="fixed inset-0 bg-black/60 z-40 flex items-center justify-center p-4 overflow-auto" onClick={() => setShowConfig(false)}>
          <div className="bg-slate-800 rounded-xl p-5 max-w-lg w-full my-8" onClick={e => e.stopPropagation()}>
            <h2 className="text-lg font-bold mb-4">⚙️ Google Drive</h2>

            <div className="flex items-center gap-2 mb-4 px-3 py-2 rounded-lg bg-slate-900">
              <span className={'w-2 h-2 rounded-full ' + (driveConnected ? 'bg-green-400' : 'bg-slate-500')}></span>
              <span className="text-sm text-slate-300">{driveConnected ? 'Conectado' : 'Desconectado'}</span>
            </div>

            <details className="mb-4 bg-slate-900 rounded-lg p-3 text-xs text-slate-300">
              <summary className="cursor-pointer text-slate-200 font-medium">📋 Como obter o Client ID (1ª vez)</summary>
              <ol className="list-decimal pl-5 mt-2 space-y-1.5">
                <li>Abra <span className="text-brand-400">console.cloud.google.com</span> e crie um projeto.</li>
                <li>Em <b>APIs &amp; Services → Library</b>, ative <b>Google Drive API</b>.</li>
                <li>Em <b>APIs &amp; Services → OAuth consent screen</b>, escolha <b>External</b>, preencha nome do app + seu email, adicione seu email em <b>Test users</b>.</li>
                <li>Em <b>APIs &amp; Services → Credentials → Create credentials → OAuth client ID → Web application</b>:
                  <ul className="list-disc pl-5 mt-1">
                    <li><b>Authorized JavaScript origins:</b> <code className="bg-slate-800 px-1 rounded">http://localhost:3094</code> e a URL do GitHub Pages</li>
                  </ul>
                </li>
                <li>Copie o <b>Client ID</b> (termina em <code>.apps.googleusercontent.com</code>) e cole abaixo.</li>
              </ol>
            </details>

            <div className="space-y-3">
              <div>
                <label className="text-xs text-slate-400">Client ID</label>
                <input value={clientId} onChange={e => setClientId(e.target.value)} className="w-full px-3 py-2 rounded bg-slate-700 border border-slate-600 text-white text-sm mt-1 font-mono" placeholder="xxxxx.apps.googleusercontent.com" />
              </div>
              <div>
                <label className="text-xs text-slate-400">ID da Pasta Compartilhada (opcional)</label>
                <input value={sharedFolderId} onChange={e => setSharedFolderId(parseFolderId(e.target.value))} className="w-full px-3 py-2 rounded bg-slate-700 border border-slate-600 text-white text-sm mt-1 font-mono" placeholder="cole o ID ou a URL completa da pasta" />
                <p className="text-xs text-slate-500 mt-1">Abra a pasta no Drive — o ID está na URL: <code className="bg-slate-900 px-1 rounded">drive.google.com/drive/folders/<b>ID</b></code>. Compartilhe a pasta com a equipe como <b>Editor</b>.</p>
              </div>
              <div className="flex gap-2">
                {!driveConnected ? (
                  <button onClick={conectarDrive} disabled={!clientId} className="flex-1 px-4 py-2 rounded-lg text-sm bg-blue-600 hover:bg-blue-500 disabled:bg-slate-700 disabled:text-slate-500">🔗 Conectar Drive</button>
                ) : (
                  <button onClick={desconectarDrive} className="flex-1 px-4 py-2 rounded-lg text-sm bg-slate-700 hover:bg-slate-600">Desconectar</button>
                )}
              </div>
              {driveConnected && (
                sharedFolderId
                  ? <div className="space-y-2">
                      <p className="text-xs text-green-400">✓ PDFs na <b>pasta compartilhada</b> em subpastas <code className="bg-slate-900 px-1 rounded">MM_YYYY/</code>. Lista de faturas numa <b>planilha</b> (<code className="bg-slate-900 px-1 rounded">{SHEET_FILE_NAME}</code>) no mesmo lugar — toda a equipe vê os mesmos dados.</p>
                      {dataFileId && (
                        <a href={`https://docs.google.com/spreadsheets/d/${dataFileId}/edit`} target="_blank" rel="noopener" className="inline-block px-3 py-1.5 rounded-lg text-xs bg-slate-700 hover:bg-slate-600 text-slate-200">📊 Abrir planilha no Sheets</a>
                      )}
                    </div>
                  : <p className="text-xs text-yellow-400">⚠️ Sem pasta compartilhada configurada — arquivos vão para o <b>seu Drive pessoal</b> e <b>não serão visíveis para a equipe</b>. Cole o ID acima para centralizar.</p>
              )}
            </div>

            <button onClick={() => setShowConfig(false)} className="w-full mt-4 px-4 py-2 rounded-lg text-sm bg-slate-700 hover:bg-slate-600">Fechar</button>
          </div>
        </div>
      )}

      {/* Alerta global de vencidas */}
      {buckets.vencidas.length > 0 && (
        <button onClick={() => setAba('caixa')} className="w-full text-left bg-red-900/50 border border-red-700 rounded-xl p-4 hover:bg-red-900/70 transition">
          <p className="text-sm font-medium text-red-200">🔴 {buckets.vencidas.length} fatura(s) vencida(s) — total {fmt(totalBucket(buckets.vencidas))} <span className="text-red-300 font-normal">(clique para ver)</span></p>
        </button>
      )}

      {/* Abas */}
      <div className="flex gap-1 bg-slate-800 rounded-xl p-1">
        {['dre', 'caixa'].map(a => (
          <button key={a} onClick={() => { setAba(a); }}
            className={'flex-1 px-4 py-2.5 rounded-lg text-sm font-medium transition ' + (aba === a ? 'bg-brand-gradient text-white shadow' : 'text-slate-400 hover:text-white')}>
            {a === 'dre' ? '📋 DRE (Competência)' : '📅 Contas a Pagar'}
          </button>
        ))}
      </div>

      {/* Filtros */}
      <div className="flex flex-wrap gap-2">
        {aba === 'dre' && mesesDRE.length > 0 && (
          <select value={mesDRE} onChange={e => setMesDRE(e.target.value)} className="px-3 py-1.5 rounded-lg bg-slate-700 border border-slate-600 text-white text-xs">
            <option value="">Todos os meses</option>
            {mesesDRE.map(m => <option key={m} value={m}>{m}</option>)}
          </select>
        )}
        <select value={filtroCat} onChange={e => setFiltroCat(e.target.value)} className="px-3 py-1.5 rounded-lg bg-slate-700 border border-slate-600 text-white text-xs">
          <option value="">Todas categorias</option>
          {CATEGORIAS.map(c => <option key={c.value} value={c.value}>{c.label}</option>)}
        </select>
        <select value={filtroStatus} onChange={e => setFiltroStatus(e.target.value)} className="px-3 py-1.5 rounded-lg bg-slate-700 border border-slate-600 text-white text-xs">
          <option value="">Todos status</option>
          <option value="Pendente">⏳ Pendente</option>
          <option value="Pago">✅ Pago</option>
          <option value="Vencido">🔴 Vencido</option>
          <option value="Agendado">📅 Agendado</option>
        </select>
        <input value={busca} onChange={e => setBusca(e.target.value)} className="flex-1 min-w-[120px] px-3 py-1.5 rounded-lg bg-slate-700 border border-slate-600 text-white text-xs" placeholder="🔍 Buscar..." />
      </div>

      {/* Drop zone */}
      <div 
        className={'border-2 border-dashed rounded-xl p-6 text-center transition ' + (dragOver ? 'drag-over border-brand-500' : 'border-slate-600')}
        onDragOver={e => { e.preventDefault(); setDragOver(true); }}
        onDragLeave={() => setDragOver(false)}
        onDrop={e => { e.preventDefault(); handleDrop(e.dataTransfer.files); }}
        onClick={() => fileInputRef.current?.click()}
      >
        <input ref={fileInputRef} type="file" accept=".pdf,.csv,.xlsx,.xls,.png,.jpg" className="hidden" onChange={e => handleDrop(e.target.files)} />
        <p className="text-slate-400 text-sm">📎 Arraste a fatura aqui ou clique para anexar</p>
        <p className="text-slate-600 text-xs mt-1">PDF, CSV, Excel, Imagem — IA extrai automaticamente</p>
      </div>

      {/* Form Modal */}
      {showForm && (
        <div className="fixed inset-0 bg-black/60 z-30 flex items-start justify-center p-4 pt-10 overflow-auto" onClick={() => !editando && resetForm()}>
          <div className="bg-slate-800 rounded-xl p-5 max-w-lg w-full" onClick={e => e.stopPropagation()}>
            <h2 className="text-lg font-bold mb-4">{editando ? '✏️ Editar Fatura' : '📄 Nova Fatura'}</h2>
            <div className="mb-4">
              <input ref={modalFileInputRef} type="file" accept=".pdf,.csv,.xlsx,.xls,.png,.jpg,.jpeg" className="hidden" onChange={handleModalUpload} />
              <button type="button" onClick={() => modalFileInputRef.current?.click()} className="w-full px-4 py-3 rounded-lg text-sm bg-slate-700 hover:bg-slate-600 border border-dashed border-slate-500 text-slate-200">
                📎 {form.arquivo_nome ? `Trocar arquivo: ${form.arquivo_nome}` : 'Anexar Fatura (PDF, Excel, CSV) — extrai dados automaticamente'}
              </button>
              {lendoIA && <p className="text-brand-400 text-xs mt-2 animate-pulse">🤖 Lendo documento...</p>}
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-xs text-slate-400">Fornecedor *</label>
                <input value={form.fornecedor} onChange={e => setForm({...form, fornecedor: e.target.value})} className="w-full px-3 py-2 rounded bg-slate-700 border border-slate-600 text-white text-sm mt-1" placeholder="Ex: Meta Ads" />
              </div>
              <div>
                <label className="text-xs text-slate-400">Valor (R$) *</label>
                <input type="number" step="0.01" value={form.valor} onChange={e => setForm({...form, valor: e.target.value})} className="w-full px-3 py-2 rounded bg-slate-700 border border-slate-600 text-white text-sm mt-1" placeholder="0,00" />
                {form.moeda_original === 'USD' && form.valor_original && (
                  <p className="text-xs text-brand-400 mt-1">💵 USD {parseFloat(form.valor_original).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})} convertido @ PTAX média R$ {parseFloat(form.taxa_ptax).toLocaleString('pt-BR',{minimumFractionDigits:4})}</p>
                )}
              </div>
              <div>
                <label className="text-xs text-slate-400">Data DRE (Competência)</label>
                <input type="date" value={form.data_dre} onChange={e => setForm({...form, data_dre: e.target.value})} className="w-full px-3 py-2 rounded bg-slate-700 border border-slate-600 text-white text-sm mt-1" />
              </div>
              <div>
                <label className="text-xs text-slate-400">Data Pagamento Prevista</label>
                <input type="date" value={form.data_pagamento} onChange={e => setForm({...form, data_pagamento: e.target.value})} className="w-full px-3 py-2 rounded bg-slate-700 border border-slate-600 text-white text-sm mt-1" />
              </div>
              <div>
                <label className="text-xs text-slate-400">Categoria</label>
                <select value={form.categoria} onChange={e => setForm({...form, categoria: e.target.value})} className="w-full px-3 py-2 rounded bg-slate-700 border border-slate-600 text-white text-sm mt-1">
                  <option value="">Selecione...</option>
                  {CATEGORIAS.map(c => <option key={c.value} value={c.value}>{c.label}</option>)}
                </select>
              </div>
              <div>
                <label className="text-xs text-slate-400">Status</label>
                <select value={form.status} onChange={e => setForm({...form, status: e.target.value})} className="w-full px-3 py-2 rounded bg-slate-700 border border-slate-600 text-white text-sm mt-1">
                  <option value="Pendente">⏳ Pendente</option>
                  <option value="Pago">✅ Pago</option>
                  <option value="Vencido">🔴 Vencido</option>
                  <option value="Agendado">📅 Agendado</option>
                </select>
              </div>
              <div className="col-span-2">
                <label className="text-xs text-slate-400">Nome da Fatura (gerado automaticamente)</label>
                <input value={gerarNomeFatura(form) || '—'} disabled className="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-slate-400 text-sm mt-1 font-mono" />
              </div>
              <div className="col-span-2">
                <label className="text-xs text-slate-400">Observações</label>
                <textarea value={form.observacoes} onChange={e => setForm({...form, observacoes: e.target.value})} className="w-full px-3 py-2 rounded bg-slate-700 border border-slate-600 text-white text-sm mt-1" rows="2" />
              </div>
            </div>
            {form.arquivo_anexado && (
              <div className="mt-3 flex items-center gap-2 px-3 py-2 rounded-lg bg-slate-900">
                <input id="drive-check" type="checkbox" checked={salvarNoDriveCheck && driveConnected} disabled={!driveConnected} onChange={e => setSalvarNoDriveCheck(e.target.checked)} className="accent-brand-600" />
                <label htmlFor="drive-check" className={'text-sm flex-1 ' + (driveConnected ? 'text-slate-200 cursor-pointer' : 'text-slate-500')}>
                  ☁️ Salvar arquivo no Google Drive
                </label>
                {!driveConnected && (
                  <button type="button" onClick={() => { setShowConfig(true); }} className="text-xs text-brand-400 hover:text-brand-300">Configurar</button>
                )}
              </div>
            )}
            <div className="flex gap-2 mt-4">
              <button onClick={salvarFatura} disabled={salvandoDrive} className="flex-1 px-4 py-2.5 rounded-lg text-sm font-medium text-white bg-brand-gradient btn-orange-glow disabled:opacity-60">
                {salvandoDrive ? '☁️ Enviando ao Drive...' : (editando ? 'Atualizar' : 'Salvar Fatura')}
              </button>
              <button onClick={() => { resetForm(); setShowForm(false); setEditando(null); }} disabled={salvandoDrive} className="px-4 py-2.5 rounded-lg text-sm bg-slate-700 hover:bg-slate-600 disabled:opacity-50">Cancelar</button>
            </div>
          </div>
        </div>
      )}

      {/* ABAS DE CONTEUDO */}
      {aba === 'dre' && (
        <div className="space-y-3">
          {/* KPI Cards DRE */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div className="bg-slate-800 rounded-xl p-4">
              <p className="text-xs text-slate-400">Total DRE ({mesDRE || 'geral'})</p>
              <p className="text-2xl font-bold text-white">{fmt(totalDRE)}</p>
            </div>
            <div className="bg-slate-800 rounded-xl p-4">
              <p className="text-xs text-slate-400">Faturas</p>
              <p className="text-2xl font-bold text-white">{faturasDRE.length}</p>
            </div>
            <div className="bg-slate-800 rounded-xl p-4">
              <p className="text-xs text-slate-400">Categorias usadas</p>
              <p className="text-2xl font-bold text-white">{categoriasUsadas}<span className="text-sm text-slate-500"> / {totalCategorias}</span></p>
            </div>
          </div>

          {/* Tabela DRE */}
          <div className="bg-slate-800 rounded-xl overflow-hidden">
            <div className="px-4 py-3 flex justify-between items-center border-b border-slate-700">
              <p className="text-sm font-medium">Faturas DRE ({faturasDRE.length})</p>
              <button onClick={() => exportarExcel(faturasDRE, 'dre')} className="px-3 py-1.5 rounded-lg text-xs bg-green-700 hover:bg-green-600">📥 Excel</button>
            </div>
            {faturasDRE.length === 0 ? (
              <div className="p-8 text-center text-slate-500 text-sm">Nenhuma fatura encontrada. Arraste um PDF acima!</div>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead>
                    <tr className="text-left text-slate-400 text-xs border-b border-slate-700">
                      <th className="p-3">Fornecedor</th>
                      <th className="p-3">Categoria</th>
                      <th className="p-3 text-right">Valor</th>
                      <th className="p-3">Data DRE</th>
                      <th className="p-3">Status</th>
                      <th className="p-3">Ações</th>
                    </tr>
                  </thead>
                  <tbody>
                    {faturasDRE.map(f => (
                      <tr key={f.id} className="border-b border-slate-700/50 hover:bg-slate-700/30">
                        <td className="p-3 text-white font-medium">{f.fornecedor}</td>
                        <td className="p-3 text-slate-300 text-xs">{(f.categoria || '').split('(')[0].trim()}</td>
                        <td className="p-3 text-right font-mono text-white">{fmt(f.valor)}</td>
                        <td className="p-3 text-slate-300">{fmtData(f.data_dre)}</td>
                        <td className="p-3">
                          <button onClick={() => toggleStatus(f)} className={'px-2 py-0.5 rounded text-xs font-medium ' +
                            ((f.status || 'Pendente') === 'Pago' ? 'bg-green-900 text-green-300' :
                             (f.status || 'Pendente') === 'Vencido' ? 'bg-red-900 text-red-300' :
                             (f.status || 'Pendente') === 'Agendado' ? 'bg-blue-900 text-blue-300' : 'bg-yellow-900 text-yellow-300')}>
                            {f.status || 'Pendente'}
                          </button>
                        </td>
                        <td className="p-3">
                          <div className="flex gap-1">
                            {f.drive_link && (
                              <a href={f.drive_link} target="_blank" rel="noopener" title="Abrir no Drive" className="px-2 py-1 rounded text-xs bg-blue-900 hover:bg-blue-800">☁️</a>
                            )}
                            <button onClick={() => editar(f)} className="px-2 py-1 rounded text-xs bg-slate-700 hover:bg-slate-600">✏️</button>
                            <button onClick={() => excluir(f)} className="px-2 py-1 rounded text-xs bg-red-900 hover:bg-red-800">🗑️</button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      )}

      {aba === 'caixa' && (
        <div className="space-y-3">
          {/* KPI Cards Contas a Pagar */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div className="bg-red-900/40 border border-red-700 rounded-xl p-4">
              <p className="text-xs text-red-300">🔴 Vencidas</p>
              <p className="text-2xl font-bold text-red-300">{fmt(totalBucket(buckets.vencidas))}</p>
              <p className="text-xs text-red-400 mt-1">{buckets.vencidas.length} fatura(s)</p>
            </div>
            <div className="bg-yellow-900/40 border border-yellow-700/50 rounded-xl p-4">
              <p className="text-xs text-yellow-300">⏰ Próximos 7 dias</p>
              <p className="text-2xl font-bold text-yellow-300">{fmt(totalBucket(buckets.semana))}</p>
              <p className="text-xs text-yellow-400 mt-1">{buckets.semana.length} fatura(s)</p>
            </div>
            <div className="bg-slate-800 rounded-xl p-4">
              <p className="text-xs text-slate-400">📆 8 a 30 dias</p>
              <p className="text-2xl font-bold text-white">{fmt(totalBucket(buckets.mes))}</p>
              <p className="text-xs text-slate-500 mt-1">{buckets.mes.length} fatura(s)</p>
            </div>
            <div className="bg-slate-800 rounded-xl p-4">
              <p className="text-xs text-slate-400">🔮 Após 30 dias</p>
              <p className="text-2xl font-bold text-white">{fmt(totalBucket(buckets.futuro))}</p>
              <p className="text-xs text-slate-500 mt-1">{buckets.futuro.length} fatura(s)</p>
            </div>
          </div>

          {/* Tabela Contas a Pagar */}
          <div className="bg-slate-800 rounded-xl overflow-hidden">
            <div className="px-4 py-3 flex justify-between items-center border-b border-slate-700">
              <p className="text-sm font-medium">Total a pagar: <span className="text-brand-400 font-bold">{fmt(totalAPagar)}</span> em {aPagar.length} fatura(s)</p>
              <button onClick={() => exportarExcel(aPagar, 'contas_a_pagar')} className="px-3 py-1.5 rounded-lg text-xs bg-green-700 hover:bg-green-600">📥 Excel</button>
            </div>
            {aPagar.length === 0 ? (
              <div className="p-8 text-center text-slate-500 text-sm">Nenhuma conta pendente. 🎉</div>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead>
                    <tr className="text-left text-slate-400 text-xs border-b border-slate-700">
                      <th className="p-3">Fornecedor</th>
                      <th className="p-3">Categoria</th>
                      <th className="p-3 text-right">Valor</th>
                      <th className="p-3">Vencimento</th>
                      <th className="p-3">Status</th>
                      <th className="p-3">Ações</th>
                    </tr>
                  </thead>
                  <tbody>
                    {aPagar.map(f => {
                      const cor = f._dias < 0 ? 'text-red-400' : f._dias <= 7 ? 'text-yellow-400' : 'text-slate-300';
                      const rotulo = f._dias < 0 ? `(vencida há ${-f._dias}d)` : f._dias === 0 ? '(hoje)' : `(em ${f._dias}d)`;
                      const linhaBg = f._dias < 0 ? 'bg-red-950/30' : '';
                      return (
                        <tr key={f.id} className={'border-b border-slate-700/50 hover:bg-slate-700/30 ' + linhaBg}>
                          <td className="p-3 text-white font-medium">{f.fornecedor}</td>
                          <td className="p-3 text-slate-300 text-xs">{(f.categoria || '').split('(')[0].trim()}</td>
                          <td className={'p-3 text-right font-mono ' + cor}>{fmt(f.valor)}</td>
                          <td className={'p-3 ' + cor}>
                            <div>{fmtData(f.data_pagamento)}</div>
                            <div className="text-xs opacity-80">{rotulo}</div>
                          </td>
                          <td className="p-3">
                            <button onClick={() => toggleStatus(f)} className={'px-2 py-0.5 rounded text-xs font-medium ' +
                              ((f.status || 'Pendente') === 'Pago' ? 'bg-green-900 text-green-300' :
                               (f.status || 'Pendente') === 'Vencido' ? 'bg-red-900 text-red-300' :
                               (f.status || 'Pendente') === 'Agendado' ? 'bg-blue-900 text-blue-300' : 'bg-yellow-900 text-yellow-300')}>
                              {f.status || 'Pendente'}
                            </button>
                          </td>
                          <td className="p-3">
                            <div className="flex gap-1">
                              {f.drive_link && (
                                <a href={f.drive_link} target="_blank" rel="noopener" title="Abrir no Drive" className="px-2 py-1 rounded text-xs bg-blue-900 hover:bg-blue-800">☁️</a>
                              )}
                              <button onClick={() => editar(f)} className="px-2 py-1 rounded text-xs bg-slate-700 hover:bg-slate-600">✏️</button>
                              <button onClick={() => excluir(f)} className="px-2 py-1 rounded text-xs bg-red-900 hover:bg-red-800">🗑️</button>
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      )}

      {/* Footer */}
      <div className="text-center text-xs text-slate-600 pt-4 pb-2">
        FinancialS v4 • {faturas.length} faturas cadastradas • Dados salvos no navegador
      </div>
    </div>
  );
}

// ===== RENDER =====
const root = ReactDOM.createRoot(document.getElementById('app'));
root.render(React.createElement(App));
</script>
</body>
</html>

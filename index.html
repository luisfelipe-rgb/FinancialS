<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinancialS — Organizador Financeiro</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand: { 400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9' }
      }
    }
  }
}
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
* { font-family: 'Inter', sans-serif; }
body { background: #0f172a; }
input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.7); }
input[type="number"]::-webkit-inner-spin-button { opacity: 0.5; }
.scrollbar-thin::-webkit-scrollbar { width: 4px; }
.scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
.scrollbar-thin::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
.fade-in { animation: fadeIn 0.3s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.toast { animation: slideDown 0.3s ease-out; }
@keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body class="text-white min-h-screen">
  <div id="root" class="max-w-6xl mx-auto p-3 md:p-5 space-y-4"></div>
  <div id="toast-container" class="fixed top-4 right-4 z-50"></div>

  <script type="text/babel">
  const { useState, useEffect } = React;

  // DATA STORE
  const STORE_KEY = 'financials_v1';
  function loadData() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || { faturas: [], saldoCaixa: 0 }; }
    catch(e) { return { faturas: [], saldoCaixa: 0 }; }
  }
  function saveData(data) {
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  }

  const CATS = [
    { v: 'BPO', l: '📋 BPO', c: '#818cf8' },
    { v: 'Viagens', l: '✈️ Viagens', c: '#34d399' },
    { v: 'Provedores', l: '🔧 Provedores', c: '#fbbf24' },
    { v: 'Publicidade', l: '📢 Publicidade', c: '#f472b6' },
    { v: 'Nao categorizado', l: '❓ Outros', c: '#94a3b8' }
  ];
  const ST = ['Pendente','Pago','Vencido','Agendado'];
  const STC = { Pendente:'#f59e0b', Pago:'#22c55e', Vencido:'#ef4444', Agendado:'#3b82f6' };

  const fmt = v => v ? 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2}) : 'R$ 0,00';
  const fmtD = d => d ? d.split('-').reverse().join('/') : '—';
  const id = () => Date.now().toString(36) + Math.random().toString(36).substr(2,5);

  function App() {
    const db = loadData();
    const [f, setF] = useState(db.faturas || []);
    const [sal, setSal] = useState(db.saldoCaixa || '');
    const [aba, setAba] = useState('dre');
    const [fCat, setFCat] = useState('');
    const [fMes, setFMes] = useState('');
    const [fMesC, setFMesC] = useState('');
    const [busca, setBusca] = useState('');
    const [form, setForm] = useState({ nome:'', fornecedor:'', valor:'', data_dre:'', data_pagamento:'', categoria:'', status:'Pendente', observacoes:'' });
    const [showForm, setShowForm] = useState(false);
    const [edit, setEdit] = useState(null);
    const [toast, setToast] = useState('');

    useEffect(() => {
      const d = loadData(); d.saldoCaixa = parseFloat(sal)||0; saveData(d);
    }, [sal, f]);

    useEffect(() => { if(toast) setTimeout(() => setToast(''), 2500); }, [toast]);

    const sv = (novas) => { const d = loadData(); d.faturas = novas; saveData(d); setF(novas); };
    const tost = (m) => setToast(m);

    const salvar = () => {
      if (!form.nome || !form.valor) { tost('⚠️ Preencha nome e valor'); return; }
      const ft = { id: edit ? edit.id : id(), nome: form.nome, fornecedor: form.fornecedor, valor: parseFloat(form.valor)||0, data_dre: form.data_dre, data_pagamento: form.data_pagamento, categoria: form.categoria||'Nao categorizado', status: form.status, observacoes: form.observacoes };
      sv(edit ? f.map(x => x.id === edit.id ? ft : x) : [...f, ft]);
      tost(edit ? '✅ Atualizada' : '✅ Cadastrada');
      setForm({ nome:'', fornecedor:'', valor:'', data_dre:'', data_pagamento:'', categoria:'', status:'Pendente', observacoes:'' });
      setShowForm(false); setEdit(null);
    };

    const editar = (item) => {
      setForm({ nome:item.nome||'', fornecedor:item.fornecedor||'', valor:String(item.valor||''), data_dre:item.data_dre||'', data_pagamento:item.data_pagamento||'', categoria:item.categoria||'', status:item.status||'Pendente', observacoes:item.observacoes||'' });
      setEdit(item); setShowForm(true);
    };

    const excluir = (item) => { if (!confirm('Excluir "'+item.nome+'"?')) return; sv(f.filter(x => x.id !== item.id)); tost('🗑️ Excluída'); };

    const toggleSt = (item) => {
      const idx = ST.indexOf(item.status);
      sv(f.map(x => x.id === item.id ? {...x, status: ST[(idx+1)%ST.length]} : x));
    };

    const exportXLS = (rows, pre) => {
      if (!rows.length) { tost('⚠️ Nenhum dado'); return; }
      const ws = XLSX.utils.json_to_sheet(rows.map(x => ({'Fatura':x.nome,'Fornecedor':x.fornecedor,'Valor R$':x.valor,'Data DRE':fmtD(x.data_dre),'Data Pagto':fmtD(x.data_pagamento),'Categoria':x.categoria,'Status':x.status})));
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Faturas');
      XLSX.writeFile(wb, pre+'_'+new Date().toISOString().split('T')[0]+'.xlsx');
      tost('✅ Excel baixado!');
    };

    // Dados filtrados
    const mesesD = [...new Set(f.filter(x=>x.data_dre).map(x=>x.data_dre.substring(0,7)))].sort().reverse();
    const mesesC = [...new Set(f.filter(x=>x.data_pagamento).map(x=>x.data_pagamento.substring(0,7)))].sort().reverse();

    const fDRE = f.filter(x => {
      if (fMes && (!x.data_dre || !x.data_dre.startsWith(fMes))) return false;
      if (fCat && x.categoria !== fCat) return false;
      if (busca) { const t = busca.toLowerCase(); if (!(x.nome||'').toLowerCase().includes(t) && !(x.fornecedor||'').toLowerCase().includes(t)) return false; }
      return true;
    });

    const fCx = f.filter(x => {
      if (fMesC && (!x.data_pagamento || !x.data_pagamento.startsWith(fMesC))) return false;
      if (fCat && x.categoria !== fCat) return false;
      if (busca) { const t = busca.toLowerCase(); if (!(x.nome||'').toLowerCase().includes(t) && !(x.fornecedor||'').toLowerCase().includes(t)) return false; }
      return true;
    });

    const totDRE = fDRE.reduce((s,x) => s + (Number(x.valor)||0), 0);

    // Caixa
    const saldo = parseFloat(sal)||0;
    const aPagar = f.filter(x => x.status==='Pendente'||x.status==='Vencido').reduce((s,x) => s + (Number(x.valor)||0), 0);
    const saldoProj = saldo - aPagar;
    const hoje = new Date();
    const ordenado = f.filter(x => (x.status==='Pendente'||x.status==='Vencido') && x.data_pagamento).sort((a,b)=>(a.data_pagamento||'').localeCompare(b.data_pagamento||''));
    const v7 = ordenado.filter(x => (new Date(x.data_pagamento+'T12:00:00')-hoje)/86400000 <= 7);
    const v15 = ordenado.filter(x => (new Date(x.data_pagamento+'T12:00:00')-hoje)/86400000 <= 15);
    const v30 = ordenado.filter(x => (new Date(x.data_pagamento+'T12:00:00')-hoje)/86400000 <= 30);

    const ic = "w-full px-3 py-2.5 rounded-lg bg-slate-800 border border-slate-600 text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent placeholder-slate-400";
    const bc = "px-4 py-2.5 rounded-lg text-sm font-medium transition-all duration-200";

    return (
      <div className="space-y-4">
        {toast && <div className="toast fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-xl bg-slate-800 text-white border border-slate-600">{toast}</div>}

        <div className="flex items-center justify-between">
          <h1 className="text-xl md:text-2xl font-bold text-white"><span className="text-brand-400">Financial</span>S</h1>
          <button onClick={() => { setForm({nome:'',fornecedor:'',valor:'',data_dre:'',data_pagamento:'',categoria:'',status:'Pendente',observacoes:''}); setEdit(null); setShowForm(true); }}
            className="px-4 h-10 bg-brand-600 hover:bg-brand-500 text-white rounded-lg text-sm font-semibold">+ Nova Fatura</button>
        </div>

        <div className="flex flex-wrap gap-2">
          <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Buscar..." className="flex-1 min-w-[150px] px-3 h-10 rounded-lg bg-slate-800 border border-slate-600 text-white text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500"/>
          <select value={fCat} onChange={e=>setFCat(e.target.value)} className="px-3 h-10 rounded-lg bg-slate-800 border border-slate-600 text-white text-sm">
            <option value="">Todas</option>
            {CATS.map(c => <option key={c.v} value={c.v}>{c.l}</option>)}
          </select>
        </div>

        <div className="flex gap-1 bg-slate-800/50 rounded-lg p-1">
          <button onClick={()=>setAba('dre')} className={'flex-1 py-2.5 rounded-lg text-sm font-medium transition-all ' + (aba==='dre'?'bg-brand-600 text-white shadow-lg':'text-slate-400 hover:text-white')}>📊 DRE</button>
          <button onClick={()=>setAba('caixa')} className={'flex-1 py-2.5 rounded-lg text-sm font-medium transition-all ' + (aba==='caixa'?'bg-brand-600 text-white shadow-lg':'text-slate-400 hover:text-white')}>💰 Caixa</button>
        </div>

        {aba === 'dre' && <div className="space-y-4 fade-in">
          <div className="flex flex-wrap gap-2 items-center">
            <span className="text-xs text-slate-400 uppercase">Mês:</span>
            <select value={fMes} onChange={e=>setFMes(e.target.value)} className="px-3 h-9 rounded-lg bg-slate-800 border border-slate-600 text-white text-sm">
              <option value="">Todos</option>
              {mesesD.map(m => <option key={m} value={m}>{m}</option>)}
            </select>
            <button onClick={()=>exportXLS(fDRE,'dre')} className="ml-auto px-3 h-9 rounded-lg bg-slate-700 hover:bg-slate-600 text-white text-sm">⬇ Excel</button>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div className="bg-slate-800/80 rounded-xl p-4 border border-slate-700/50"><p className="text-xs text-slate-400 uppercase">Total DRE</p><p className="text-2xl font-bold text-white mt-1">{fmt(totDRE)}</p></div>
            <div className="bg-slate-800/80 rounded-xl p-4 border border-slate-700/50"><p className="text-xs text-slate-400 uppercase">Faturas</p><p className="text-2xl font-bold text-white mt-1">{fDRE.length}</p></div>
            <div className="bg-slate-800/80 rounded-xl p-4 border border-slate-700/50"><p className="text-xs text-slate-400 uppercase">Filtradas</p><p className="text-2xl font-bold text-white mt-1">{fDRE.length}</p></div>
          </div>

          <div className="bg-slate-800/50 rounded-xl border border-slate-700/50 overflow-hidden">
            <div className="overflow-x-auto max-h-[400px] overflow-y-auto">
              <table className="w-full text-sm">
                <thead className="sticky top-0 bg-slate-900">
                  <tr className="text-left text-slate-400 text-xs uppercase tracking-wider">
                    <th className="p-3 font-medium">Fatura</th><th className="p-3 font-medium">Fornecedor</th>
                    <th className="p-3 font-medium text-right">Valor</th><th className="p-3 font-medium">Data DRE</th>
                    <th className="p-3 font-medium">Status</th><th className="p-3 font-medium">Ações</th>
                  </tr>
                </thead>
                <tbody>
                  {fDRE.map(x => <tr key={x.id} className="border-t border-slate-700/30 hover:bg-slate-700/20">
                    <td className="p-3 text-white font-medium">{x.nome}</td>
                    <td className="p-3 text-slate-300">{x.fornecedor||'—'}</td>
                    <td className="p-3 text-right font-mono text-white">{fmt(x.valor)}</td>
                    <td className="p-3 text-slate-300">{fmtD(x.data_dre)}</td>
                    <td className="p-3"><button onClick={()=>toggleSt(x)} className="px-2 py-0.5 rounded text-xs font-medium" style={{backgroundColor:STC[x.status]+'20',color:STC[x.status]}}>{x.status}</button></td>
                    <td className="p-3"><div className="flex gap-1"><button onClick={()=>editar(x)} className="px-2 py-1 rounded bg-slate-700 hover:bg-slate-600 text-xs text-white">✏️</button><button onClick={()=>excluir(x)} className="px-2 py-1 rounded bg-red-900/50 hover:bg-red-800/50 text-xs text-red-400">🗑️</button></div></td>
                  </tr>)}
                  {fDRE.length===0 && <tr><td colSpan="6" className="p-8 text-center text-slate-500">Nenhuma fatura</td></tr>}
                </tbody>
              </table>
            </div>
          </div>
        </div>}

        {aba === 'caixa' && <div className="space-y-4 fade-in">
          <div className="bg-slate-800/80 rounded-xl p-4 border border-slate-700/50">
            <p className="text-xs text-slate-400 uppercase mb-2">Saldo Bancário</p>
            <div className="flex gap-3 items-center">
              <span className="text-lg text-slate-400">R$</span>
              <input type="number" value={sal} onChange={e=>setSal(e.target.value)} className="flex-1 bg-transparent text-2xl font-bold text-white outline-none" placeholder="0,00"/>
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div className="bg-slate-800/80 rounded-xl p-4 border border-slate-700/50"><p className="text-xs text-slate-400 uppercase">Saldo</p><p className="text-xl font-bold text-white mt-1">{fmt(saldo)}</p></div>
            <div className="bg-slate-800/80 rounded-xl p-4 border border-slate-700/50"><p className="text-xs text-slate-400 uppercase">A Pagar</p><p className="text-xl font-bold text-red-400 mt-1">{fmt(aPagar)}</p></div>
            <div className="bg-slate-800/80 rounded-xl p-4 border border-slate-700/50"><p className="text-xs text-slate-400 uppercase">Projetado</p><p className={'text-xl font-bold mt-1 '+(saldoProj>=0?'text-green-400':'text-red-400')}>{fmt(saldoProj)}</p></div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div className="bg-slate-800/80 rounded-xl p-4 border border-slate-700/50"><p className="text-xs text-slate-400 uppercase">7 dias</p><p className="text-lg font-bold text-orange-400 mt-1">{fmt(v7.reduce((s,x)=>s+Number(x.valor||0),0))}</p><p className="text-xs text-slate-500">{v7.length} fatura(s)</p></div>
            <div className="bg-slate-800/80 rounded-xl p-4 border border-slate-700/50"><p className="text-xs text-slate-400 uppercase">15 dias</p><p className="text-lg font-bold text-yellow-400 mt-1">{fmt(v15.reduce((s,x)=>s+Number(x.valor||0),0))}</p><p className="text-xs text-slate-500">{v15.length} fatura(s)</p></div>
            <div className="bg-slate-800/80 rounded-xl p-4 border border-slate-700/50"><p className="text-xs text-slate-400 uppercase">30 dias</p><p className="text-lg font-bold text-brand-400 mt-1">{fmt(v30.reduce((s,x)=>s+Number(x.valor||0),0))}</p><p className="text-xs text-slate-500">{v30.length} fatura(s)</p></div>
          </div>

          <div className="flex flex-wrap gap-2 items-center">
            <span className="text-xs text-slate-400 uppercase">Mês:</span>
            <select value={fMesC} onChange={e=>setFMesC(e.target.value)} className="px-3 h-9 rounded-lg bg-slate-800 border border-slate-600 text-white text-sm">
              <option value="">Todos</option>
              {mesesC.map(m => <option key={m} value={m}>{m}</option>)}
            </select>
            <button onClick={()=>exportXLS(fCx,'caixa')} className="ml-auto px-3 h-9 rounded-lg bg-slate-700 hover:bg-slate-600 text-white text-sm">⬇ Excel</button>
          </div>

          <div className="bg-slate-800/50 rounded-xl border border-slate-700/50 overflow-hidden">
            <div className="overflow-x-auto max-h-[400px] overflow-y-auto">
              <table className="w-full text-sm">
                <thead className="sticky top-0 bg-slate-900">
                  <tr className="text-left text-slate-400 text-xs uppercase tracking-wider">
                    <th className="p-3 font-medium">Fatura</th><th className="p-3 font-medium">Fornecedor</th>
                    <th className="p-3 font-medium text-right">Valor</th><th className="p-3 font-medium">Data Pagto</th>
                    <th className="p-3 font-medium">Status</th><th className="p-3 font-medium">Ações</th>
                  </tr>
                </thead>
                <tbody>
                  {fCx.map(x => <tr key={x.id} className="border-t border-slate-700/30 hover:bg-slate-700/20">
                    <td className="p-3 text-white font-medium">{x.nome}</td>
                    <td className="p-3 text-slate-300">{x.fornecedor||'—'}</td>
                    <td className="p-3 text-right font-mono text-white">{fmt(x.valor)}</td>
                    <td className="p-3 text-slate-300">{fmtD(x.data_pagamento)}</td>
                    <td className="p-3"><button onClick={()=>toggleSt(x)} className="px-2 py-0.5 rounded text-xs font-medium" style={{backgroundColor:STC[x.status]+'20',color:STC[x.status]}}>{x.status}</button></td>
                    <td className="p-3"><div className="flex gap-1"><button onClick={()=>editar(x)} className="px-2 py-1 rounded bg-slate-700 hover:bg-slate-600 text-xs text-white">✏️</button><button onClick={()=>excluir(x)} className="px-2 py-1 rounded bg-red-900/50 hover:bg-red-800/50 text-xs text-red-400">🗑️</button></div></td>
                  </tr>)}
                  {fCx.length===0 && <tr><td colSpan="6" className="p-8 text-center text-slate-500">Nenhuma fatura</td></tr>}
                </tbody>
              </table>
            </div>
          </div>
        </div>}

        {showForm && <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-40 p-4" onClick={()=>setShowForm(false)}>
          <div className="bg-slate-800 rounded-2xl p-5 w-full max-w-lg border border-slate-600 shadow-2xl" onClick={e=>e.stopPropagation()}>
            <h2 className="text-lg font-bold text-white mb-4">{edit?'✏️ Editar':'📋 Nova'} Fatura</h2>
            <div className="space-y-3">
              <div><label className="text-xs text-slate-400 uppercase mb-1 block">Nome *</label><input value={form.nome} onChange={e=>setForm({...form,nome:e.target.value})} className={ic} placeholder="Meta Ads - Maio/2026"/></div>
              <div><label className="text-xs text-slate-400 uppercase mb-1 block">Fornecedor</label><input value={form.fornecedor} onChange={e=>setForm({...form,fornecedor:e.target.value})} className={ic} placeholder="Meta Ads"/></div>
              <div className="grid grid-cols-2 gap-3">
                <div><label className="text-xs text-slate-400 uppercase mb-1 block">Valor (R$) *</label><input type="number" step="0.01" value={form.valor} onChange={e=>setForm({...form,valor:e.target.value})} className={ic} placeholder="0,00"/></div>
                <div><label className="text-xs text-slate-400 uppercase mb-1 block">Categoria</label><select value={form.categoria} onChange={e=>setForm({...form,categoria:e.target.value})} className={ic}><option value="">Selecione</option>{CATS.map(c=><option key={c.v} value={c.v}>{c.l}</option>)}</select></div>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div><label className="text-xs text-slate-400 uppercase mb-1 block">Data DRE</label><input type="date" value={form.data_dre} onChange={e=>setForm({...form,data_dre:e.target.value})} className={ic}/></div>
                <div><label className="text-xs text-slate-400 uppercase mb-1 block">Data Pagto</label><input type="date" value={form.data_pagamento} onChange={e=>setForm({...form,data_pagamento:e.target.value})} className={ic}/></div>
              </div>
              <div><label className="text-xs text-slate-400 uppercase mb-1 block">Status</label><select value={form.status} onChange={e=>setForm({...form,status:e.target.value})} className={ic}>{ST.map(s=><option key={s} value={s}>{s}</option>)}</select></div>
              <div><label className="text-xs text-slate-400 uppercase mb-1 block">Obs</label><textarea value={form.observacoes} onChange={e=>setForm({...form,observacoes:e.target.value})} className={ic+' resize-none h-16'} placeholder="Observações..."/></div>
              <div className="flex gap-3 pt-2">
                <button onClick={()=>{setShowForm(false);setEdit(null)}} className={bc+' bg-slate-700 hover:bg-slate-600 text-white flex-1'}>Cancelar</button>
                <button onClick={salvar} className={bc+' bg-brand-600 hover:bg-brand-500 text-white flex-1 font-semibold'}>{edit?'✏️ Atualizar':'💾 Salvar'}</button>
              </div>
            </div>
          </div>
        </div>}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
